name: V16 Blue Final QA
on:
  push:
    branches:
      - client-review-v16-blue-refinement
    paths:
      - .github/workflows/v16-blue-final-qa.yml
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: client-review-v16-blue-refinement
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /index.html
            /projects.html
            /machines.html
            /gallery.html
            /404.html
            /styles.css
            /v16.css
            /v16-final.css
            /v16-step3.css
            /v16-step4.css
            /v16-step5.css
            /v16-step6.css
            /v16-subpages.css
            /v16-blue-refinement.css
            /app.js
            /app-v14.js
            /data.js
            /media/**
      - name: Install browser
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Start site
        run: |
          python3 -m http.server 4173 >/tmp/vsk-server.log 2>&1 &
          sleep 2
      - name: Strict final check
        run: |
          cat > final-blue-qa.cjs <<'JS'
          const { chromium }=require('playwright');
          const fs=require('fs');
          const wait=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const failures=[],report=[];
            const files=['index.html','projects.html','machines.html','gallery.html','404.html'];
            for(const file of files){
              for(const [mode,width,height] of [['desktop',1440,1000],['mobile',390,844]]){
                const page=await browser.newPage({viewport:{width,height}});
                const pageErrors=[],bad=[];
                page.on('pageerror',e=>pageErrors.push(String(e)));
                page.on('response',r=>{if(r.status()>=400&&r.url().startsWith('http://127.0.0.1:4173/'))bad.push(`${r.status()} ${r.url()}`)});
                await page.goto('http://127.0.0.1:4173/'+file,{waitUntil:'networkidle'}); await wait(450);
                const start=await page.evaluate(()=>({
                  width:document.documentElement.scrollWidth,
                  theme:document.querySelector('meta[name="theme-color"]')?.content||'',
                  robots:document.querySelector('meta[name="robots"]')?.content||'',
                  green:[...document.querySelectorAll('body *')].filter(el=>el.offsetParent!==null).flatMap(el=>{
                    const s=getComputedStyle(el),vals=[s.color,s.backgroundColor,s.borderTopColor,s.borderRightColor,s.borderBottomColor,s.borderLeftColor];
                    return vals.some(v=>v.includes('40, 95, 80')||v.includes('159, 194, 181'))?[el.tagName+'.'+el.className,vals]:[];
                  }).slice(0,20)
                }));
                if(start.width>width+2)failures.push(`${file}/${mode}: overflow ${start.width}>${width}`);
                if(start.theme.toUpperCase()!=='#0D1824')failures.push(`${file}/${mode}: theme ${start.theme}`);
                if(!start.robots.includes('noindex'))failures.push(`${file}/${mode}: noindex missing`);
                if(start.green.length)failures.push(`${file}/${mode}: rejected green still visible ${JSON.stringify(start.green.slice(0,4))}`);

                if(file==='index.html'){
                  const hero=await page.evaluate(()=>{
                    const main=document.querySelector('.hero-board-main img'),photo=document.querySelector('.hero-board-photo img');
                    const a=document.querySelector('.hero-blue-copy h1 span'),b=document.querySelector('.hero-blue-copy h1 em');
                    return {label:document.querySelector('.hero-board-tag')?.textContent.trim()||'',src:main?.getAttribute('src')||'',main:!!main&&main.complete&&main.naturalWidth>0,photo:!!photo&&photo.complete&&photo.naturalWidth>0,white:a?getComputedStyle(a).color:'',blue:b?getComputedStyle(b).color:'',proof:document.querySelector('.hero-proof-chip')?.textContent.trim()||''};
                  });
                  if(!hero.label.includes('04 SERVO')||!hero.label.includes('SPM'))failures.push(`home/${mode}: engineering tag wrong ${hero.label}`);
                  if(!hero.src.includes('4-servo-seal-slotting-machine/slotting-mc-1.webp'))failures.push(`home/${mode}: CAD hero not active ${hero.src}`);
                  if(!hero.main||!hero.photo)failures.push(`home/${mode}: hero media not loaded ${JSON.stringify(hero)}`);
                  if(!hero.white.includes('255, 255, 255')||!hero.blue.includes('69, 169, 232'))failures.push(`home/${mode}: white/blue headline split wrong ${hero.white} / ${hero.blue}`);
                  if(!hero.proof.includes('300+'))failures.push(`home/${mode}: proof chip missing`);
                  if(mode==='desktop'){
                    await page.locator('.hero').screenshot({path:'final-blue-hero-desktop.png'});
                    await page.locator('.capabilities').scrollIntoViewIfNeeded();await wait(200);await page.locator('.capabilities').screenshot({path:'final-blue-capabilities.png'});
                    await page.locator('.engineering-depth').scrollIntoViewIfNeeded();await wait(200);await page.locator('.engineering-depth').screenshot({path:'final-blue-proof.png'});
                  }else await page.locator('.hero').screenshot({path:'final-blue-hero-mobile.png'});
                }
                if(file==='404.html')await page.screenshot({path:`final-blue-404-${mode}.png`,fullPage:true});

                await page.evaluate(async()=>{const h=document.documentElement.scrollHeight,step=Math.max(500,Math.floor(innerHeight*.72));for(let y=0;y<h;y+=step){scrollTo(0,y);await new Promise(r=>setTimeout(r,70));}scrollTo(0,h)});await wait(file==='gallery.html'?1400:500);
                const end=await page.evaluate(()=>({width:document.documentElement.scrollWidth,broken:[...document.images].filter(i=>i.offsetParent!==null&&i.complete&&i.naturalWidth===0).map(i=>i.src)}));
                if(end.width>width+2)failures.push(`${file}/${mode}: final overflow ${end.width}>${width}`);
                if(end.broken.length)failures.push(`${file}/${mode}: broken media ${end.broken.join(',')}`);
                if(pageErrors.length)failures.push(`${file}/${mode}: JS errors ${pageErrors.join(' | ')}`);
                const uniqueBad=[...new Set(bad)];if(uniqueBad.length)failures.push(`${file}/${mode}: local request failures ${uniqueBad.join(' | ')}`);
                report.push({file,mode,start,end,pageErrors,bad:uniqueBad});
                await page.close();
              }
            }
            const copy=['index.html','projects.html','machines.html','gallery.html'].map(f=>fs.readFileSync(f,'utf8')).join('\n');
            const stale=['giving buyers a practical way','Use the index for technical depth','Browse each project as a complete visual chapter','Explore selected machines and retrofits through the application'];
            for(const phrase of stale)if(copy.includes(phrase))failures.push(`copy audit: stale site-facing phrase remains: ${phrase}`);
            fs.writeFileSync('final-blue-report.json',JSON.stringify({failures,report},null,2));console.log(JSON.stringify({failures},null,2));
            await browser.close();if(failures.length)process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node final-blue-qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v16-blue-final-preview
          path: |
            final-blue-*.png
            final-blue-report.json
          retention-days: 14
          if-no-files-found: warn
