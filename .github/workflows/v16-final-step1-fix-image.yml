name: Fix V16 About Image

on:
  push:
    branches: [client-review-v16-final-step1-working]
    paths:
      - '.github/workflows/v16-final-step1-fix-image.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: client-review-v16-final-step1-working
          fetch-depth: 1
      - name: Replace missing legacy image
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='media/legacy/enclosed-machine.webp'
          new='media/projects/slotting.webp'
          if old not in s:
              raise SystemExit('Expected legacy image reference not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix broken V16 About image' || exit 0
          git push origin HEAD:client-review-v16-final-step1-working
