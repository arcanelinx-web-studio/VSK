name: V16 Release QA
on:
  push:
    branches:
      - client-review-v16-blue-refinement
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: client-review-v16-blue-refinement
          fetch-depth: 1

      - name: Install browser QA
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Start VSK preview
        run: |
          python3 -m http.server 4173 >/tmp/vsk-release.log 2>&1 &
          sleep 2

      - name: Validate every customer viewport
        run: |
          cat > release-qa.cjs <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const wait = ms => new Promise(r => setTimeout(r, ms));

          const viewports = [
            ['desktop-1920',1920,1080],['desktop-1680',1680,1050],['desktop-1440',1440,900],
            ['laptop-1366',1366,768],['laptop-1280',1280,800],['tablet-1024',1024,768],
            ['tablet-768',768,1024],['mobile-430',430,932],['mobile-390',390,844],['mobile-360',360,800]
          ];
          const pages = ['index.html','machines.html','gallery.html','404.html'];
          const fail = [], rows = [];
          const local = 'http://127.0.0.1:4173/';

          (async()=>{
            const browser = await chromium.launch({headless:true});
            for (const file of pages) {
              for (const [mode,w,h] of viewports) {
                const p = await browser.newPage({viewport:{width:w,height:h}});
                const pageErrors = [], badRequests = [];
                p.on('pageerror',e=>pageErrors.push(String(e)));
                p.on('response',r=>{ if(r.status()>=400 && r.url().startsWith(local)) badRequests.push(`${r.status()} ${r.url()}`); });
                await p.goto(local+file,{waitUntil:'networkidle'});
                await wait(file==='gallery.html'||file==='machines.html'?1900:1100);

                const audit = await p.evaluate(({w,file})=>{
                  const visible = el => !!el && el.offsetParent!==null;
                  const rect = el => el ? el.getBoundingClientRect() : null;
                  const broken = [...document.images].filter(i=>visible(i)&&i.complete&&i.naturalWidth===0).map(i=>i.src);
                  const navAnchors = [...document.querySelectorAll('.desktop-nav a,.mobile-menu nav a')];
                  const nav = navAnchors.map(a=>a.textContent.trim()).join(' | ');
                  const retrofitLink = navAnchors.find(a=>/Retrofit & CNC/i.test(a.textContent));
                  const rootWidth = document.documentElement.scrollWidth;
                  const header = document.querySelector('.site-header'),brand=document.querySelector('.site-header .brand'),desktopNav=document.querySelector('.desktop-nav');
                  const navLinks=[...document.querySelectorAll('.desktop-nav a')].filter(visible),cta=document.querySelector('.header-cta'),menu=document.querySelector('.menu-toggle');
                  const footerText=document.querySelector('.site-footer')?.innerText||'';
                  const clipping=[...document.querySelectorAll('h1,h2,h3,.btn,.text-cta,.ghost-cta,.header-cta,.contact-main,.contact-secondary,.hero-board-main figcaption')]
                    .filter(visible).filter(el=>{const s=getComputedStyle(el);return s.overflow!=='visible'&&(el.scrollWidth>el.clientWidth+3||el.scrollHeight>el.clientHeight+3);})
                    .slice(0,12).map(el=>({tag:el.tagName,cls:String(el.className||''),text:el.textContent.trim().slice(0,70),sw:el.scrollWidth,cw:el.clientWidth,sh:el.scrollHeight,ch:el.clientHeight}));
                  const offscreen=[...document.querySelectorAll('main section')].filter(visible).filter(el=>{const r=rect(el);return r.left<-2||r.right>w+2;}).map(el=>String(el.className||'')).slice(0,10);
                  const result={rootWidth,broken,nav,retrofitHref:retrofitLink?.getAttribute('href')||'',footerText,clipping,offscreen,header:rect(header),brand:rect(brand),navRect:rect(desktopNav),cta:rect(cta),menu:rect(menu),navFirst:rect(navLinks[0]),navLast:rect(navLinks.at(-1))};
                  if(file==='index.html'){
                    const selected=[...document.querySelectorAll('[data-home-projects] .project-card')].filter(visible);
                    result.selected=selected.length;
                    result.selectedTitles=selected.map(x=>x.textContent.trim());
                    result.selectedRects=selected.map(rect);
                    result.depthCards=[...document.querySelectorAll('.engineering-depth .metric-card')].filter(visible).length;
                    result.depthGrid=rect(document.querySelector('.engineering-depth .depth-grid'));
                    result.metric=rect(document.querySelector('.engineering-depth .metric-card'));
                    result.callout=rect(document.querySelector('.engineering-depth .archive-callout'));
                    result.depthHead=rect(document.querySelector('.engineering-depth .depth-head'));
                    result.heroCaptionText=document.querySelector('.hero-board-main figcaption')?.innerText||'';
                    result.featureSection=rect(document.querySelector('.projects-showcase'));
                    result.featureIntro=rect(document.querySelector('.projects-showcase .section-intro'));
                  }
                  if(file==='machines.html'){
                    const cards=[...document.querySelectorAll('.experience-visual-card')].filter(visible);
                    result.references=cards.length;
                    result.mediaCards=cards.length;
                    result.mediaBadges=[...document.querySelectorAll('.experience-media-badge')].filter(visible).length;
                    result.exactCards=[...document.querySelectorAll('.experience-media-badge.is-exact')].filter(visible).length;
                  }
                  if(file==='gallery.html') result.galleryGroups=[...document.querySelectorAll('[data-gallery-grid] > *')].filter(visible).length;
                  return result;
                },{w,file});

                if(audit.rootWidth>w+2) fail.push(`${file}/${mode}: horizontal overflow ${audit.rootWidth}px > ${w}px`);
                if(audit.broken.length) fail.push(`${file}/${mode}: broken visible media ${audit.broken.join(', ')}`);
                if(audit.offscreen.length) fail.push(`${file}/${mode}: offscreen sections ${audit.offscreen.join(', ')}`);
                if(audit.clipping.length) fail.push(`${file}/${mode}: clipped UI ${JSON.stringify(audit.clipping)}`);
                if(pageErrors.length) fail.push(`${file}/${mode}: JS ${pageErrors.join(' | ')}`);
                if(badRequests.length) fail.push(`${file}/${mode}: requests ${[...new Set(badRequests)].join(' | ')}`);

                if(file!=='404.html'){
                  if(/Projects/i.test(audit.nav)) fail.push(`${file}/${mode}: Projects still appears in customer navigation`);
                  if(!/Experience/i.test(audit.nav)) fail.push(`${file}/${mode}: Experience missing from navigation`);
                  if(!/Gallery/i.test(audit.nav)) fail.push(`${file}/${mode}: Gallery missing from navigation`);
                  if(!audit.retrofitHref.includes('machines.html?type=retrofit')) fail.push(`${file}/${mode}: Retrofit nav points to ${audit.retrofitHref}`);
                  if(!audit.footerText.includes('+91 98803 36714')||!audit.footerText.includes('+91 73531 00095')) fail.push(`${file}/${mode}: footer is missing one or both phone numbers`);
                }

                if(w>1180&&file!=='404.html'&&audit.navFirst&&audit.navLast&&audit.brand&&audit.cta){
                  if(audit.navFirst.left<audit.brand.right+8) fail.push(`${file}/${mode}: brand/nav collision`);
                  if(audit.navLast.right>audit.cta.left-8) fail.push(`${file}/${mode}: nav/CTA collision`);
                }

                if(file==='index.html'){
                  if(audit.selected!==5) fail.push(`${file}/${mode}: Selected Experience rendered ${audit.selected} cards, expected 5`);
                  if(audit.selectedTitles.some(t=>/Kellenberg/i.test(t))) fail.push(`${file}/${mode}: Kellenberg is duplicated inside Selected Experience`);
                  const heights=audit.selectedRects.map(r=>Math.round(r.height));
                  if(heights.length&&Math.max(...heights)-Math.min(...heights)>2) fail.push(`${file}/${mode}: Selected Experience card heights are inconsistent ${heights.join(',')}`);
                  if(audit.depthCards!==3) fail.push(`${file}/${mode}: Engineering Depth has ${audit.depthCards} proof cards, expected 3`);
                  if(audit.depthGrid&&(audit.depthGrid.left<-2||audit.depthGrid.right>w+2)) fail.push(`${file}/${mode}: Engineering Depth grid exceeds viewport`);
                  if(audit.depthHead&&audit.depthGrid&&Math.abs(audit.depthHead.left-audit.depthGrid.left)>3) fail.push(`${file}/${mode}: Engineering Depth heading/grid left edges do not align`);
                  if(w>=1180&&audit.metric?.height>360) fail.push(`${file}/${mode}: Engineering Depth proof card is too tall (${audit.metric.height}px)`);
                  if(w>=1180&&audit.callout&&Math.abs(audit.callout.height-audit.metric.height)>4) fail.push(`${file}/${mode}: Engineering Depth callout/card heights do not match`);
                  if(/APPLICATION-LED ENGINEER/i.test(audit.heroCaptionText)) fail.push(`${file}/${mode}: old clipped hero caption survived`);
                  if(audit.featureSection&&audit.featureIntro&&audit.featureIntro.top-audit.featureSection.top>110) fail.push(`${file}/${mode}: Featured Engineering has excessive top whitespace`);
                  const autoButton=p.locator('[data-capability="automation"]');
                  if(await autoButton.count()){await autoButton.click();await wait(180);const autoSrc=await p.locator('[data-capability-image]').getAttribute('src');if(String(autoSrc).includes('slotting-mc-1.webp')) fail.push(`${file}/${mode}: Automation capability still reuses hero image`);}
                  if(w>=901){const aboutHeight=await p.locator('.about').evaluate(el=>el.getBoundingClientRect().height);if(aboutHeight<h-100) fail.push(`${file}/${mode}: Company section too short (${aboutHeight}px)`);}
                  await p.locator('.engineering-depth').screenshot({path:`engineering-depth-${mode}.png`});
                  if(['desktop-1920','laptop-1366','tablet-768','mobile-390'].includes(mode)) await p.screenshot({path:`home-${mode}.png`,fullPage:true});
                }
                if(file==='machines.html'){
                  if(audit.references!==54) fail.push(`${file}/${mode}: Experience rendered ${audit.references} visual references, expected 54`);
                  if(audit.mediaCards!==audit.mediaBadges) fail.push(`${file}/${mode}: ${audit.mediaCards} Experience cards but ${audit.mediaBadges} media labels`);
                  if(audit.exactCards<1) fail.push(`${file}/${mode}: no project-specific Experience media was identified`);
                }
                if(file==='gallery.html'&&audit.galleryGroups<1) fail.push(`${file}/${mode}: Gallery rendered no project groups`);
                rows.push({file,mode,w,h,audit,pageErrors,badRequests});
                await p.close();
              }
            }

            const retrofit=await browser.newPage({viewport:{width:1440,height:900}});
            await retrofit.goto(local+'machines.html?type=retrofit',{waitUntil:'networkidle'});await wait(1900);
            const activeType=await retrofit.locator('[data-type-filter="retrofit"]').evaluate(el=>el.classList.contains('is-active'));
            const retrofitCards=await retrofit.locator('.experience-visual-card').count();
            if(!activeType||retrofitCards!==15) fail.push(`retrofit route: expected active Retrofit filter with 15 visual cards, got active=${activeType}, cards=${retrofitCards}`);
            await retrofit.close();

            const redirect=await browser.newPage({viewport:{width:1440,height:900}});
            await redirect.goto(local+'projects.html',{waitUntil:'networkidle'});await wait(500);
            if(!redirect.url().includes('/machines.html')) fail.push(`projects.html: legacy route did not fold into Experience (${redirect.url()})`);
            await redirect.close();

            fs.writeFileSync('release-qa-report.json',JSON.stringify({fail,rows},null,2));
            console.log(JSON.stringify({fail},null,2));
            await browser.close();
            if(fail.length) process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node release-qa.cjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v16-release-qa
          path: |
            engineering-depth-*.png
            home-*.png
            release-qa-report.json
          retention-days: 14
