name: V16 Release QA
on:
  push:
    branches:
      - client-review-v16-blue-refinement
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: client-review-v16-blue-refinement
          fetch-depth: 1

      - name: Install browser QA
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Start preview
        run: |
          python3 -m http.server 4173 >/tmp/vsk-release.log 2>&1 &
          sleep 2

      - name: Validate final V16 review build
        run: |
          cat > release-qa.cjs <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const wait = ms => new Promise(r => setTimeout(r, ms));
          const local = 'http://127.0.0.1:4173/';
          const viewports = [
            ['desktop-1920',1920,1080],['desktop-1680',1680,1050],['desktop-1440',1440,900],
            ['tablet-1024',1024,768],['tablet-768',768,1024],['mobile-390',390,844]
          ];
          const pages = ['index.html','machines.html','gallery.html'];
          const fail = [], report = [];

          (async()=>{
            const browser = await chromium.launch({headless:true});
            const bannerByMode={};
            for (const file of pages) {
              for (const [mode,w,h] of viewports) {
                const page = await browser.newPage({viewport:{width:w,height:h}});
                const pageErrors=[];
                page.on('pageerror',e=>pageErrors.push(String(e)));
                await page.goto(local+file,{waitUntil:'networkidle'});
                await wait(file==='gallery.html'?1900:1300);

                const audit = await page.evaluate(({file,w})=>{
                  const visible = el => !!el && el.offsetParent !== null;
                  const rect = el => el ? el.getBoundingClientRect() : null;
                  const result={
                    scrollWidth:document.documentElement.scrollWidth,
                    broken:[...document.images].filter(i=>visible(i)&&i.complete&&i.naturalWidth===0).map(i=>i.src),
                    footer:document.querySelector('.site-footer')?.innerText||'',
                    nav:[...document.querySelectorAll('.desktop-nav a,.mobile-menu nav a')].map(a=>a.textContent.trim()).join(' | '),
                    bootVisible:visible(document.querySelector('#v16-boot-screen'))
                  };

                  if(file==='index.html'){
                    const selectedGrid=document.querySelector('[data-home-projects]');
                    const selected=[...document.querySelectorAll('[data-home-projects] .project-card')].filter(visible);
                    const depth=document.querySelector('.engineering-depth');
                    const depthGrid=document.querySelector('.engineering-depth .depth-grid');
                    const metricStack=document.querySelector('.engineering-depth .metric-stack');
                    const metrics=[...document.querySelectorAll('.engineering-depth .metric-card')].filter(visible);
                    const callout=document.querySelector('.engineering-depth .archive-callout');
                    result.selectedCount=selected.length;
                    result.selectedTitles=selected.map(x=>x.textContent.trim());
                    result.selectedGridRect=rect(selectedGrid);
                    result.selectedHeights=selected.map(x=>Math.round(x.getBoundingClientRect().height));
                    result.depthBg=depth?getComputedStyle(depth).backgroundColor:'';
                    result.depthGridRect=rect(depthGrid);
                    result.metricAlign=metrics.map(x=>getComputedStyle(x).textAlign);
                    result.metricPadding=metrics.map(x=>parseFloat(getComputedStyle(x).paddingLeft)||0);
                    result.metricStackGap=metricStack?getComputedStyle(metricStack).columnGap:'';
                    result.metricStackTop=metricStack?getComputedStyle(metricStack).borderTopColor:'';
                    result.metricProofCounts=metrics.map(x=>({
                      tolerance:(x.innerText.match(/Tolerance reference/g)||[]).length,
                      alignment:(x.innerText.match(/Alignment reference/g)||[]).length,
                      cycle:(x.innerText.match(/Cycle reference/g)||[]).length
                    }));
                    result.calloutBg=callout?getComputedStyle(callout).backgroundColor:'';
                    result.calloutImage=callout?getComputedStyle(callout).backgroundImage:'';
                    result.calloutBefore=callout?getComputedStyle(callout,'::before').content:'';
                    result.calloutAfter=callout?getComputedStyle(callout,'::after').content:'';
                    result.calloutClipped=!!callout&&(callout.scrollHeight>callout.clientHeight+3||callout.scrollWidth>callout.clientWidth+3);
                  }

                  if(file==='machines.html'){
                    const hero=document.querySelector('.archive-hero');
                    result.heroBg=hero?getComputedStyle(hero).backgroundColor:'';
                    result.heroHeight=hero?Math.round(hero.getBoundingClientRect().height):0;
                    result.indexVisible=visible(document.querySelector('[data-archive-index-view]'));
                    result.references=[...document.querySelectorAll('.archive-row[data-machine-id]')].filter(visible).length;
                  }

                  if(file==='gallery.html'){
                    const hero=document.querySelector('.gallery-hero');
                    result.heroBg=hero?getComputedStyle(hero).backgroundColor:'';
                    result.heroHeight=hero?Math.round(hero.getBoundingClientRect().height):0;
                    result.heroStripVisible=visible(document.querySelector('.gallery-hero-strip'));
                    result.categoryButtons=[...document.querySelectorAll('[data-gallery-category]')].filter(visible).map(x=>x.innerText.trim());
                    result.legacyGroupButtons=[...document.querySelectorAll('[data-gallery-filter-list] [data-gallery-filter]')].filter(visible).length;
                    result.galleryGroups=[...document.querySelectorAll('[data-gallery-grid] .gallery-project-group')].filter(visible).length;
                  }
                  return result;
                },{file,w});

                if(audit.scrollWidth>w+2) fail.push(`${file}/${mode}: horizontal overflow ${audit.scrollWidth}px > ${w}px`);
                if(audit.broken.length) fail.push(`${file}/${mode}: broken images ${audit.broken.join(', ')}`);
                if(pageErrors.length) fail.push(`${file}/${mode}: JS errors ${pageErrors.join(' | ')}`);
                if(audit.bootVisible) fail.push(`${file}/${mode}: obsolete loading overlay is visible`);
                if(/Projects/i.test(audit.nav)) fail.push(`${file}/${mode}: obsolete Projects navigation visible`);
                if(!audit.footer.includes('+91 98803 36714')||!audit.footer.includes('+91 73531 00095')) fail.push(`${file}/${mode}: footer phone numbers inconsistent`);

                if(file==='index.html'){
                  if(audit.selectedCount!==5) fail.push(`${file}/${mode}: expected 5 Selected Experience cards, got ${audit.selectedCount}`);
                  if(audit.selectedTitles.some(t=>/Kellenberg|Rod Boring/i.test(t))) fail.push(`${file}/${mode}: dedicated case duplicated in Selected Experience`);
                  if(audit.selectedHeights.length&&Math.max(...audit.selectedHeights)-Math.min(...audit.selectedHeights)>3) fail.push(`${file}/${mode}: Selected Experience heights inconsistent`);
                  if(w>=1180&&audit.selectedGridRect){
                    const left=Math.round(audit.selectedGridRect.left),right=Math.round(w-audit.selectedGridRect.right);
                    if(Math.abs(left-right)>3) fail.push(`${file}/${mode}: Selected Experience gutters asymmetric (${left}/${right})`);
                  }
                  if(audit.depthBg!=='rgb(250, 250, 247)') fail.push(`${file}/${mode}: Engineering Depth background is not light ivory (${audit.depthBg})`);
                  if(w>=1180&&audit.depthGridRect){
                    const left=Math.round(audit.depthGridRect.left),right=Math.round(w-audit.depthGridRect.right);
                    if(Math.abs(left-right)>3) fail.push(`${file}/${mode}: Engineering Depth gutters asymmetric (${left}/${right})`);
                  }
                  if(audit.metricAlign.some(v=>v!=='left')) fail.push(`${file}/${mode}: Engineering Depth proof cards are not left aligned`);
                  if(audit.metricPadding.some(v=>v<28)) fail.push(`${file}/${mode}: Engineering Depth proof content needs more breathing room`);
                  if(w>=1180&&audit.metricStackGap!=='0px') fail.push(`${file}/${mode}: measured proof board is not the connected three-cell presentation`);
                  if(audit.calloutClipped) fail.push(`${file}/${mode}: 54 Experience card content is clipped`);
                  if(audit.calloutBg!=='rgb(13, 24, 36)') fail.push(`${file}/${mode}: 54 card does not use Experience navy (${audit.calloutBg})`);
                  if(audit.calloutImage!=='none') fail.push(`${file}/${mode}: 54 card still has a gradient/image treatment`);
                  if(!['none','normal'].includes(audit.calloutBefore)||!['none','normal'].includes(audit.calloutAfter)) fail.push(`${file}/${mode}: 54 card still has decorative pseudo-elements`);
                  if(audit.metricProofCounts.some(x=>x.tolerance>1||x.alignment>1||x.cycle>1)) fail.push(`${file}/${mode}: duplicate Engineering Depth copy detected`);
                  if(['desktop-1920','desktop-1440','mobile-390'].includes(mode)) await page.locator('.engineering-depth').screenshot({path:`engineering-depth-${mode}.png`});
                }

                if(file==='machines.html'){
                  bannerByMode[`machines-${mode}`]={height:audit.heroHeight,bg:audit.heroBg};
                  if(!audit.indexVisible) fail.push(`${file}/${mode}: Experience index is not visible`);
                  if(audit.references!==54) fail.push(`${file}/${mode}: expected 54 Experience references, got ${audit.references}`);
                  if(w>=1180&&audit.heroHeight!==500) fail.push(`${file}/${mode}: Experience hero is not exactly 500px (${audit.heroHeight}px)`);
                  if(audit.heroBg!=='rgb(13, 24, 36)') fail.push(`${file}/${mode}: Experience hero background mismatch (${audit.heroBg})`);
                }

                if(file==='gallery.html'){
                  bannerByMode[`gallery-${mode}`]={height:audit.heroHeight,bg:audit.heroBg};
                  if(audit.heroStripVisible) fail.push(`${file}/${mode}: old Gallery image collage is visible`);
                  if(audit.heroBg!=='rgb(13, 24, 36)') fail.push(`${file}/${mode}: Gallery hero does not match Experience dark navy (${audit.heroBg})`);
                  if(w>=1180&&audit.heroHeight!==500) fail.push(`${file}/${mode}: Gallery hero is not exactly 500px (${audit.heroHeight}px)`);
                  if(audit.categoryButtons.length!==5) fail.push(`${file}/${mode}: expected 5 Gallery project categories, got ${audit.categoryButtons.length}`);
                  if(audit.categoryButtons.some(t=>!/project/i.test(t))) fail.push(`${file}/${mode}: Gallery category buttons do not show project counts`);
                  if(audit.legacyGroupButtons) fail.push(`${file}/${mode}: long individual project-name filters are still visible`);
                  if(audit.galleryGroups<1) fail.push(`${file}/${mode}: Gallery has no visible project groups`);
                }

                report.push({file,mode,audit,pageErrors});
                await page.close();
              }
            }

            for (const [mode] of viewports) {
              const e=bannerByMode[`machines-${mode}`],g=bannerByMode[`gallery-${mode}`];
              if(e&&g&&Math.abs(e.height-g.height)>1) fail.push(`${mode}: Experience/Gallery hero heights differ (${e.height}/${g.height})`);
              if(e&&g&&e.bg!==g.bg) fail.push(`${mode}: Experience/Gallery hero backgrounds differ (${e.bg}/${g.bg})`);
            }

            const retrofit=await browser.newPage({viewport:{width:1440,height:900}});
            await retrofit.goto(local+'machines.html?type=retrofit',{waitUntil:'networkidle'});await wait(1600);
            const retrofitAudit=await retrofit.evaluate(()=>({
              active:document.querySelector('[data-type-filter="retrofit"]')?.classList.contains('is-active')||false,
              count:[...document.querySelectorAll('.archive-row[data-machine-id]')].filter(x=>x.offsetParent!==null).length,
              title:document.querySelector('.archive-hero h1')?.innerText||''
            }));
            if(!retrofitAudit.active) fail.push('retrofit route: Retrofit filter is not active');
            if(retrofitAudit.count!==15) fail.push(`retrofit route: expected 15 retrofit references, got ${retrofitAudit.count}`);
            if(!/Recover capability/i.test(retrofitAudit.title)) fail.push('retrofit route: retrofit-specific hero did not load');
            await retrofit.close();

            fs.writeFileSync('release-qa-report.json',JSON.stringify({fail,report},null,2));
            console.log(JSON.stringify({fail},null,2));
            await browser.close();
            if(fail.length) process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node release-qa.cjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v16-release-qa
          path: |
            engineering-depth-*.png
            release-qa-report.json
          retention-days: 14