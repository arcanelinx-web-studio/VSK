name: V16 Final Step 3 Visual QA

on:
  push:
    branches: [client-review-v16-final-step3-working]
    paths:
      - '.github/workflows/v16-final-step3-preview.yml'
      - 'v16-step3.css'
      - 'v16-final.css'
      - 'index.html'
      - 'app.js'
      - 'app-v14.js'
      - 'data.js'

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: client-review-v16-final-step3-working
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /index.html
            /styles.css
            /v16.css
            /v16-final.css
            /v16-step3.css
            /app.js
            /app-v14.js
            /data.js
            /media/**
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Start site
        run: |
          python3 -m http.server 4173 >/tmp/vsk-server.log 2>&1 &
          sleep 2
      - name: Render and validate Step 3
        run: |
          cat > visual-step3.cjs <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const wait = ms => new Promise(r=>setTimeout(r,ms));
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const checks=[]; const failures=[];
            for (const [name,width,height] of [['1440',1440,1000],['1366',1366,768],['mobile',390,844]]) {
              const page=await browser.newPage({viewport:{width,height},deviceScaleFactor:1});
              const pageErrors=[],badResponses=[];
              page.on('pageerror',e=>pageErrors.push(String(e)));
              page.on('response',r=>{if(r.status()>=400 && r.url().startsWith('http://127.0.0.1:4173/')) badResponses.push(`${r.status()} ${r.url()}`)});
              await page.goto('http://127.0.0.1:4173/index.html',{waitUntil:'networkidle'});

              await page.locator('#projects').scrollIntoViewIfNeeded();
              await wait(650);
              await page.evaluate(async()=>{
                const imgs=[...document.querySelectorAll('#projects img,.selected-projects-strip img')];
                await Promise.all(imgs.map(i=>i.complete?Promise.resolve():new Promise(r=>{i.addEventListener('load',r,{once:true});i.addEventListener('error',r,{once:true})})));
                document.activeElement?.blur();
              });
              await page.locator('#projects').screenshot({path:`step3-featured-${name}.png`});

              await page.locator('.selected-projects-strip').scrollIntoViewIfNeeded();
              await wait(350);
              await page.evaluate(()=>document.activeElement?.blur());
              await page.locator('.selected-projects-strip').screenshot({path:`step3-selected-${name}.png`});

              const feature=page.locator('[data-feature-open="rod"]').first();
              await feature.click();
              await wait(180);
              const featureDialog=await page.evaluate(()=>({
                hidden:document.querySelector('[data-dossier]')?.hidden,
                title:document.querySelector('[data-dossier-title]')?.textContent?.trim()||''
              }));
              if(featureDialog.hidden!==false || !/Rod Boring/i.test(featureDialog.title)) failures.push(`${name}: featured dossier did not open correctly (${featureDialog.title})`);
              await page.locator('[data-dossier-close]').last().click();
              await wait(120);

              const firstProject=page.locator('[data-home-projects] .project-card').first();
              await firstProject.click();
              await wait(180);
              const projectDialog=await page.evaluate(()=>({
                hidden:document.querySelector('[data-dossier]')?.hidden,
                title:document.querySelector('[data-dossier-title]')?.textContent?.trim()||''
              }));
              if(projectDialog.hidden!==false || !projectDialog.title) failures.push(`${name}: selected project dossier did not open`);
              await page.locator('[data-dossier-close]').last().click();

              const result=await page.evaluate(()=>{
                const root=document.documentElement;
                const projects=document.querySelector('#projects');
                const selected=document.querySelector('.selected-projects-strip');
                const grid=document.querySelector('.selected-projects-strip .project-grid-editorial');
                const cards=[...document.querySelectorAll('[data-home-projects] .project-card')];
                const ownedImages=[...document.querySelectorAll('#projects img,.selected-projects-strip img')];
                const broken=ownedImages.filter(i=>i.complete && i.naturalWidth===0).map(i=>i.src);
                const pending=ownedImages.filter(i=>!i.complete).map(i=>i.src);
                const cardRects=cards.map(c=>{const r=c.getBoundingClientRect();return {w:Math.round(r.width),h:Math.round(r.height)}});
                return {
                  viewport:innerWidth,
                  scrollWidth:root.scrollWidth,
                  linked:[...document.styleSheets].some(s=>(s.href||'').includes('v16-step3.css')),
                  projectBg:getComputedStyle(projects).backgroundColor,
                  selectedBg:getComputedStyle(selected).backgroundColor,
                  accent:getComputedStyle(projects.querySelector('.section-intro h2 em')).color,
                  scrollMargin:getComputedStyle(projects).scrollMarginTop,
                  cardCount:cards.length,
                  gridColumns:getComputedStyle(grid).gridTemplateColumns,
                  cardRects,
                  broken,pending
                };
              });
              const uniqueBad=[...new Set(badResponses)];
              checks.push({name,...result,featureDialog,projectDialog,pageErrors,badResponses:uniqueBad});
              if(!result.linked) failures.push(`${name}: v16-step3.css is not linked`);
              if(result.scrollWidth>width+2) failures.push(`${name}: horizontal overflow ${result.scrollWidth}>${width}`);
              if(!result.projectBg.includes('30, 36, 33')) failures.push(`${name}: project palette not applied ${result.projectBg}`);
              if(!result.selectedBg.includes('30, 36, 33')) failures.push(`${name}: selected project palette not applied ${result.selectedBg}`);
              if(result.accent.includes('120, 185, 239')) failures.push(`${name}: legacy blue project accent remains ${result.accent}`);
              if(result.cardCount<5) failures.push(`${name}: expected five selected project cards, got ${result.cardCount}`);
              if(name==='1440' && !(result.cardRects[0]?.w > result.cardRects[2]?.w)) failures.push('1440: editorial 2+3 project hierarchy not applied');
              if(name==='mobile' && result.cardRects.some(r=>r.w>width-20)) failures.push(`mobile: project card exceeds usable width ${JSON.stringify(result.cardRects)}`);
              if(result.broken.length) failures.push(`${name}: broken Step 3 images ${result.broken.join(', ')}`);
              if(result.pending.length) failures.push(`${name}: pending Step 3 media ${result.pending.join(', ')}`);
              if(pageErrors.length) failures.push(`${name}: page errors ${pageErrors.join(' | ')}`);
              if(uniqueBad.length) failures.push(`${name}: failed requests ${uniqueBad.join(' | ')}`);
              await page.close();
            }
            fs.writeFileSync('step3-report.json',JSON.stringify({checks,failures},null,2));
            console.log(fs.readFileSync('step3-report.json','utf8'));
            await browser.close();
            if(failures.length) process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node visual-step3.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v16-final-step3-preview
          path: |
            step3-*.png
            step3-report.json
          retention-days: 14
