name: V16 Final Launch QA

on:
  push:
    branches: [client-review-v16-final-launch-polish]
    paths:
      - '.github/workflows/v16-final-launch-qa.yml'
      - 'index.html'
      - 'projects.html'
      - 'machines.html'
      - 'gallery.html'
      - '404.html'
      - 'styles.css'
      - 'v16.css'
      - 'v16-final.css'
      - 'v16-step3.css'
      - 'v16-step4.css'
      - 'v16-step5.css'
      - 'v16-step6.css'
      - 'v16-subpages.css'
      - 'app.js'
      - 'app-v14.js'
      - 'data.js'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: client-review-v16-final-launch-polish
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /index.html
            /projects.html
            /machines.html
            /gallery.html
            /404.html
            /styles.css
            /v16.css
            /v16-final.css
            /v16-step3.css
            /v16-step4.css
            /v16-step5.css
            /v16-step6.css
            /v16-subpages.css
            /app.js
            /app-v14.js
            /data.js
            /media/**
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Start site
        run: |
          python3 -m http.server 4173 >/tmp/vsk-server.log 2>&1 &
          sleep 2
      - name: Run launch smoke and link validation
        run: |
          cat > launch-qa.cjs <<'JS'
          const { chromium } = require('playwright');
          const fs=require('fs');
          const wait=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const failures=[],checks=[];
            const pages=[
              ['home','index.html','#F4F3EE'],
              ['projects','projects.html','#17201C'],
              ['machines','machines.html','#17201C'],
              ['gallery','gallery.html','#17201C'],
              ['404','404.html','#17201c']
            ];
            const checkedLinks=new Map();

            for(const [name,file,themeExpected] of pages){
              for(const [mode,width,height] of [['desktop',1440,1000],['mobile',390,844]]){
                const page=await browser.newPage({viewport:{width,height},deviceScaleFactor:1});
                const errors=[],bad=[];
                page.on('pageerror',e=>errors.push(String(e)));
                page.on('response',r=>{if(r.status()>=400&&r.url().startsWith('http://127.0.0.1:4173/'))bad.push(`${r.status()} ${r.url()}`)});
                await page.goto(`http://127.0.0.1:4173/${file}`,{waitUntil:'networkidle'});
                await wait(name==='404'?400:850);

                const state=await page.evaluate(({is404})=>{
                  const robots=document.querySelector('meta[name="robots"]')?.content||'';
                  const theme=document.querySelector('meta[name="theme-color"]')?.content||'';
                  const imgs=[...document.images].filter(i=>i.offsetParent!==null);
                  const links=[...document.querySelectorAll('a[href]')].map(a=>a.getAttribute('href')).filter(Boolean);
                  const result={
                    width:document.documentElement.scrollWidth,
                    robots,theme,links,
                    broken:imgs.filter(i=>i.complete&&i.naturalWidth===0).map(i=>i.src),
                    pending:imgs.filter(i=>!i.complete).map(i=>i.src)
                  };
                  if(!is404){
                    const h=document.querySelector('.site-header'),f=document.querySelector('.site-footer');
                    const sheets=[...document.styleSheets].map(s=>s.href||'');
                    result.header=h?getComputedStyle(h).backgroundColor:'';
                    result.footer=f?getComputedStyle(f).backgroundColor:'';
                    result.final=sheets.some(x=>x.includes('v16-final.css'));
                    result.runtime=[...document.scripts].some(s=>(s.src||'').includes('app-v14.js'));
                  }else{
                    result.body=getComputedStyle(document.body).backgroundColor;
                    result.kicker=getComputedStyle(document.querySelector('.kicker')).color;
                    result.reference=getComputedStyle(document.querySelector('.reference')).backgroundColor;
                    result.primary=document.querySelector('.btn-primary')?.getAttribute('href')||'';
                    result.archive=document.querySelector('.btn-secondary')?.getAttribute('href')||'';
                    result.logo=document.querySelector('.brand img')?.getAttribute('src')||'';
                  }
                  return result;
                },{is404:name==='404'});

                if(state.width>width+2)failures.push(`${name}/${mode}: overflow ${state.width}>${width}`);
                if(state.robots!=='noindex,nofollow')failures.push(`${name}/${mode}: indexing lock changed to ${state.robots}`);
                if(state.theme.toLowerCase()!==themeExpected.toLowerCase())failures.push(`${name}/${mode}: theme ${state.theme}, expected ${themeExpected}`);
                if(state.broken.length)failures.push(`${name}/${mode}: broken visible images ${state.broken.join(',')}`);

                if(name!=='404'){
                  if(!state.final)failures.push(`${name}/${mode}: v16-final.css missing`);
                  if(!state.runtime)failures.push(`${name}/${mode}: app-v14 runtime missing`);
                  if(mode==='desktop'&&!state.header.includes('244, 243, 238'))failures.push(`${name}: header not ivory ${state.header}`);
                  if(!state.footer.includes('17, 24, 20'))failures.push(`${name}/${mode}: footer not Final charcoal ${state.footer}`);
                  if(mode==='mobile'){
                    await page.locator('[data-menu-toggle]').click();await wait(90);
                    const open=await page.locator('[data-mobile-menu]').evaluate(el=>!el.hidden);
                    if(!open)failures.push(`${name}/mobile: menu did not open`);
                    await page.evaluate(()=>document.querySelector('.mobile-menu-head [data-menu-close]')?.click());
                  }
                }else{
                  if(!state.body.includes('244, 243, 238'))failures.push(`404/${mode}: body not ivory ${state.body}`);
                  if(!state.kicker.includes('40, 95, 80'))failures.push(`404/${mode}: kicker not VSK green ${state.kicker}`);
                  if(!state.reference.includes('23, 32, 28'))failures.push(`404/${mode}: reference not Final charcoal ${state.reference}`);
                  if(state.primary!=='index.html'||state.archive!=='machines.html')failures.push(`404/${mode}: recovery links changed ${state.primary},${state.archive}`);
                  if(state.logo!=='media/brand/vsk-logo.webp')failures.push(`404/${mode}: logo path ${state.logo}`);
                  await page.screenshot({path:`launch-404-${mode}.png`,fullPage:true});
                }

                // Validate unique same-site HTML targets from actual page links.
                for(const href of state.links){
                  if(/^(mailto:|tel:|https?:|#|javascript:)/i.test(href))continue;
                  const clean=href.split('#')[0].split('?')[0];
                  if(!clean||!clean.endsWith('.html'))continue;
                  if(!checkedLinks.has(clean)){
                    const response=await page.request.get(`http://127.0.0.1:4173/${clean}`);
                    checkedLinks.set(clean,response.status());
                    if(response.status()>=400)failures.push(`${name}: link ${clean} returned ${response.status()}`);
                  }
                }

                checks.push({name,mode,state,errors,badResponses:[...new Set(bad)]});
                if(errors.length)failures.push(`${name}/${mode}: JS ${errors.join(' | ')}`);
                const unique=[...new Set(bad)];
                if(unique.length)failures.push(`${name}/${mode}: failed local requests ${unique.join(' | ')}`);
                await page.close();
              }
            }

            fs.writeFileSync('launch-report.json',JSON.stringify({checks,links:Object.fromEntries(checkedLinks),failures},null,2));
            console.log(fs.readFileSync('launch-report.json','utf8'));
            await browser.close();
            if(failures.length)process.exit(1);
          })().catch(e=>{try{fs.writeFileSync('launch-crash.txt',String(e.stack||e))}catch{};console.error(e);process.exit(1)});
          JS
          node launch-qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v16-final-launch-preview
          path: |
            launch-404-*.png
            launch-report.json
            launch-crash.txt
          retention-days: 14
