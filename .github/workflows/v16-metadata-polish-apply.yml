name: Apply V16 Metadata Polish
on:
  push:
    branches:
      - client-review-v16-blue-refinement
    paths:
      - .github/workflows/v16-metadata-polish-apply.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: client-review-v16-blue-refinement
          fetch-depth: 0
      - name: Apply metadata polish
        run: python3 .github/scripts/v16_metadata_polish.py
      - name: Commit and safely push
        shell: bash
        run: |
          git config user.name "Asmita G V"
          git config user.email "gujjarasmita@gmail.com"
          git add index.html projects.html machines.html gallery.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Align metadata with V16 buyer-facing hero"
          git pull --rebase origin client-review-v16-blue-refinement
          git push origin HEAD:client-review-v16-blue-refinement
