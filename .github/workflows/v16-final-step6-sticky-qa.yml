name: V16 Final Mobile CTA QA

on:
  push:
    branches: [client-review-v16-final-step6-working]
    paths:
      - '.github/workflows/v16-final-step6-sticky-qa.yml'

jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: client-review-v16-final-step6-working
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /index.html
            /styles.css
            /v16.css
            /v16-final.css
            /v16-step3.css
            /v16-step4.css
            /v16-step5.css
            /v16-step6.css
            /app.js
            /app-v14.js
            /data.js
            /media/**
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Start site
        run: |
          python3 -m http.server 4173 >/tmp/vsk-server.log 2>&1 &
          sleep 2
      - name: Validate mobile CTA
        run: |
          cat > mobile-cta.cjs <<'JS'
          const { chromium } = require('playwright');
          const fs=require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
            const pageErrors=[];page.on('pageerror',e=>pageErrors.push(String(e)));
            await page.goto('http://127.0.0.1:4173/index.html',{waitUntil:'networkidle'});
            const result=await page.evaluate(()=>{
              const el=document.querySelector('.mobile-sticky-cta');
              const s=el?getComputedStyle(el):null;
              return {exists:!!el,display:s?.display||'',bg:s?.backgroundColor||'',scrollWidth:document.documentElement.scrollWidth};
            });
            if(!result.exists) throw new Error('mobile sticky CTA markup missing');
            if(result.display!=='flex') throw new Error(`mobile sticky CTA display=${result.display}`);
            if(!result.bg.includes('40, 95, 80')) throw new Error(`mobile sticky CTA bg=${result.bg}`);
            if(result.scrollWidth>392) throw new Error(`mobile overflow ${result.scrollWidth}`);
            await page.screenshot({path:'mobile-sticky-final.png',fullPage:false});
            await page.locator('.mobile-sticky-cta').click();
            await page.waitForTimeout(120);
            const quote=await page.locator('[data-quote-panel]').evaluate(el=>({hidden:el.hidden,aria:el.getAttribute('aria-hidden')}));
            if(quote.hidden!==false || quote.aria!=='false') throw new Error('mobile CTA did not open requirement dialog');
            if(pageErrors.length) throw new Error(pageErrors.join(' | '));
            fs.writeFileSync('mobile-cta-report.json',JSON.stringify({result,quote,pageErrors},null,2));
            console.log(fs.readFileSync('mobile-cta-report.json','utf8'));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node mobile-cta.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v16-final-mobile-cta
          path: |
            mobile-sticky-final.png
            mobile-cta-report.json
          retention-days: 14
