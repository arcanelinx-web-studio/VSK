name: Deploy V15 rebuild

on:
  push:
    branches: [client-review-v15-rebuild]
    paths: [.github/workflows/deploy-v15-rebuild.yml]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: client-review-v15-rebuild
      - name: Assemble exact V15 site
        shell: bash
        run: |
          cat > /tmp/site.b64 <<'PAYLOAD'
[... ELLIPSIZATION ...]
PAYLOAD
          base64 -d /tmp/site.b64 > /tmp/site.zip
          unzip -oq /tmp/site.zip -d .
          rm -f .github/workflows/deploy-v15-rebuild.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .nojekyll 404.html index.html company.html services.html reconditioning.html retrofit-cnc.html projects.html experience.html styles.css site.js project-data.js .github/workflows/deploy-v15-rebuild.yml
          git commit -m "Rebuild VSK website from organized PHOTOS library"
          git push origin HEAD:client-review-v15-rebuild
