# Rerun after the Step 4 stylesheet link is present on the branch.
name: V16 Final Step 4 Visual QA

on:
  push:
    branches: [client-review-v16-final-step4-working]
    paths:
      - '.github/workflows/v16-final-step4-preview.yml'
      - 'v16-step4.css'
      - 'v16-step3.css'
      - 'v16-final.css'
      - 'index.html'
      - 'app.js'
      - 'app-v14.js'
      - 'data.js'

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: client-review-v16-final-step4-working
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /index.html
            /styles.css
            /v16.css
            /v16-final.css
            /v16-step3.css
            /v16-step4.css
            /app.js
            /app-v14.js
            /data.js
            /media/**
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Start site
        run: |
          python3 -m http.server 4173 >/tmp/vsk-server.log 2>&1 &
          sleep 2
      - name: Render and validate Step 4
        run: |
          cat > visual-step4.cjs <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const wait = ms => new Promise(r=>setTimeout(r,ms));
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const checks=[]; const failures=[];
            for (const [name,width,height] of [['1440',1440,1000],['1366',1366,768],['mobile',390,844]]) {
              const page=await browser.newPage({viewport:{width,height},deviceScaleFactor:1});
              const pageErrors=[],badResponses=[];
              page.on('pageerror',e=>pageErrors.push(String(e)));
              page.on('response',r=>{if(r.status()>=400 && r.url().startsWith('http://127.0.0.1:4173/')) badResponses.push(`${r.status()} ${r.url()}`)});
              await page.goto('http://127.0.0.1:4173/index.html',{waitUntil:'networkidle'});
              const section=page.locator('.engineering-depth');
              await section.scrollIntoViewIfNeeded();
              await wait(450);
              await page.evaluate(()=>document.activeElement?.blur());
              await section.screenshot({path:`step4-depth-${name}.png`});

              const metricTitles=[];
              for(const key of ['zcut','wheel','facing']){
                await page.locator(`.engineering-depth [data-feature-open="${key}"]`).click();
                await wait(120);
                const state=await page.evaluate(()=>({hidden:document.querySelector('[data-dossier]')?.hidden,title:document.querySelector('[data-dossier-title]')?.textContent?.trim()||''}));
                if(state.hidden!==false || !state.title) failures.push(`${name}: metric dossier ${key} did not open`);
                metricTitles.push(state.title);
                await page.locator('[data-dossier-close]').last().click();
                await wait(80);
              }

              const result=await page.evaluate(()=>{
                const root=document.documentElement;
                const depth=document.querySelector('.engineering-depth');
                const callout=document.querySelector('.archive-callout');
                const number=document.querySelector('.archive-callout-number');
                const metrics=[...document.querySelectorAll('.engineering-depth .metric-number')].map(el=>el.innerText.replace(/\s+/g,' ').trim());
                const archiveLink=document.querySelector('.engineering-depth .archive-callout a');
                return {
                  viewport:innerWidth,
                  scrollWidth:root.scrollWidth,
                  linked:[...document.styleSheets].some(s=>(s.href||'').includes('v16-step4.css')),
                  depthBg:getComputedStyle(depth).backgroundColor,
                  calloutBg:getComputedStyle(callout).backgroundColor,
                  archiveNumberColor:getComputedStyle(number).color,
                  metricCount:metrics.length,
                  metrics,
                  archiveNumber:number?.textContent.trim(),
                  archiveHref:archiveLink?.getAttribute('href')||'',
                  calloutWidth:Math.round(callout.getBoundingClientRect().width)
                };
              });
              const uniqueBad=[...new Set(badResponses)];
              checks.push({name,...result,metricTitles,pageErrors,badResponses:uniqueBad});
              if(!result.linked) failures.push(`${name}: v16-step4.css is not linked`);
              if(result.scrollWidth>width+2) failures.push(`${name}: horizontal overflow ${result.scrollWidth}>${width}`);
              if(!result.depthBg.includes('244, 243, 238')) failures.push(`${name}: engineering depth warm palette not applied ${result.depthBg}`);
              if(!result.calloutBg.includes('32, 41, 37')) failures.push(`${name}: archive callout dark green-charcoal not applied ${result.calloutBg}`);
              if(result.archiveNumberColor.includes('24, 63, 104')) failures.push(`${name}: legacy blue archive number remains`);
              if(result.metricCount!==3) failures.push(`${name}: expected three engineering metrics, got ${result.metricCount}`);
              if(result.metrics.join('|')!=='0.02 mm|20 μm|12 sec') failures.push(`${name}: engineering metric values changed ${result.metrics.join('|')}`);
              if(result.archiveNumber!=='54') failures.push(`${name}: archive reference count changed ${result.archiveNumber}`);
              if(result.archiveHref!=='machines.html') failures.push(`${name}: archive link changed ${result.archiveHref}`);
              if(pageErrors.length) failures.push(`${name}: page errors ${pageErrors.join(' | ')}`);
              if(uniqueBad.length) failures.push(`${name}: failed requests ${uniqueBad.join(' | ')}`);
              await page.close();
            }
            fs.writeFileSync('step4-report.json',JSON.stringify({checks,failures},null,2));
            console.log(fs.readFileSync('step4-report.json','utf8'));
            await browser.close();
            if(failures.length) process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node visual-step4.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v16-final-step4-preview
          path: |
            step4-*.png
            step4-report.json
          retention-days: 14
