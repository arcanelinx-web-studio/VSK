name: Build V16 media from PHOTOS

on:
  workflow_dispatch:
  push:
    branches:
      - client-review-v16-premium
    paths:
      - 'PHOTOS/**'
      - 'scripts/build_v16_media.py'

concurrency:
  group: v16-media-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-media:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout V16
        uses: actions/checkout@v4
        with:
          ref: client-review-v16-premium
          fetch-depth: 0

      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libheif-examples poppler-utils
          python -m pip install --upgrade pip
          python -m pip install Pillow pillow-heif

      - name: Build complete web media library
        run: python scripts/build_v16_media.py

      - name: Commit generated V16 media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/v16 media/archive-manifest.json
          if git diff --cached --quiet; then
            echo "No media changes to commit"
            exit 0
          fi
          git commit -m "Generate V16 web media from organized PHOTOS library"
          git fetch origin client-review-v16-premium
          git rebase origin/client-review-v16-premium
          git push origin HEAD:client-review-v16-premium
