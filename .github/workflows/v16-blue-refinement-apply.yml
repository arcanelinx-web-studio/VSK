name: Apply V16 Blue Refinement
on:
  push:
    branches:
      - client-review-v16-blue-refinement
    paths:
      - .github/workflows/v16-blue-refinement-apply.yml
      - .github/scripts/v16_blue_apply.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: client-review-v16-blue-refinement
          fetch-depth: 0
      - name: Apply blue refinement structure and copy
        run: python3 .github/scripts/v16_blue_apply.py
      - name: Commit and safely push
        shell: bash
        run: |
          git config user.name "Asmita G V"
          git config user.email "gujjarasmita@gmail.com"
          git add index.html projects.html machines.html gallery.html 404.html
          if git diff --cached --quiet; then
            echo "No content changes to commit"
            exit 0
          fi
          git commit -m "Restore V16 blue system and sharpen buyer-facing experience"
          git pull --rebase origin client-review-v16-blue-refinement
          git push origin HEAD:client-review-v16-blue-refinement
