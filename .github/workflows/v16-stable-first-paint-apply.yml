name: V16 Stable First Paint Apply

on:
  push:
    branches:
      - client-review-v16-blue-refinement
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stabilize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: client-review-v16-blue-refinement
          fetch-depth: 0

      - name: Normalize V16 asset loading and page boot order
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          VERSION = '16.32'
          pages = ['index.html', 'machines.html', 'gallery.html']
          preload_css = [
              'v16-user-polish.css',
              'v16-release-polish.css',
              'v16-corrections.css',
          ]

          def replace_asset_version(text, asset):
              pattern = re.escape(asset) + r'(?:\?v=[^\"\'\s>]+)?'
              return re.sub(pattern, f'{asset}?v={VERSION}', text)

          for name in pages:
              path = Path(name)
              text = path.read_text(encoding='utf-8')

              # Remove duplicate late-polish links, then preload them before the final authority.
              for asset in preload_css:
                  text = re.sub(
                      rf'\s*<link[^>]+href=[\"\']{re.escape(asset)}(?:\?[^\"\']*)?[\"\'][^>]*>\s*',
                      '\n', text, flags=re.I
                  )
              marker = re.search(r'<link[^>]+href=[\"\']v16-final-lock\.css(?:\?[^\"\']*)?[\"\'][^>]*>', text, flags=re.I)
              if marker:
                  links = ''.join(f'<link rel="stylesheet" href="{asset}?v={VERSION}">\n' for asset in preload_css)
                  text = text[:marker.start()] + links + text[marker.start():]

              # One cache version for every final-stage asset.
              for asset in [
                  'v16-final-lock.css', 'v16-review-authority.css',
                  'v16-engineering-depth-final.css', 'v16-final-lock.js',
                  'app.js', 'app-v14.js', 'experience.js', 'gallery-categories.js', 'data.js'
              ]:
                  text = replace_asset_version(text, asset)

              # Gallery no longer needs the hidden image collage in the DOM at all.
              if name == 'gallery.html':
                  text = re.sub(
                      r'<div aria-hidden=[\"\']true[\"\'] class=[\"\']gallery-hero-strip[\"\']>.*?</div><div class=[\"\']gallery-hero-shade[\"\']></div>',
                      '', text, count=1, flags=re.S
                  )

              # Deterministic, ordered script boot. app-v14 is no longer dynamically raced in.
              script_start = re.search(r'<script\s+src=[\"\']data\.js(?:\?[^\"\']*)?[\"\']></script>', text, flags=re.I)
              if script_start:
                  body_end = text.find('</body>', script_start.start())
                  if body_end != -1:
                      if name == 'index.html':
                          scripts = f'''<script src="data.js?v={VERSION}"></script>\n<script defer src="app.js?v={VERSION}"></script>\n<script defer data-v16-core src="app-v14.js?v={VERSION}"></script>\n<script defer src="v16-final-lock.js?v={VERSION}"></script>\n'''
                      elif name == 'machines.html':
                          scripts = f'''<script src="data.js?v={VERSION}"></script>\n<script defer src="app.js?v={VERSION}"></script>\n<script defer data-v16-core src="app-v14.js?v={VERSION}"></script>\n<script defer src="experience.js?v={VERSION}"></script>\n<script defer src="v16-final-lock.js?v={VERSION}"></script>\n'''
                      else:
                          scripts = f'''<script src="data.js?v={VERSION}"></script>\n<script defer src="app.js?v={VERSION}"></script>\n<script defer data-v16-core src="app-v14.js?v={VERSION}"></script>\n<script defer data-v16-gallery-categories src="gallery-categories.js?v={VERSION}"></script>\n<script defer src="v16-final-lock.js?v={VERSION}"></script>\n'''
                      text = text[:script_start.start()] + scripts + text[body_end:]

              path.write_text(text, encoding='utf-8')

          # app.js: never race app-v14 into the DOM when the static ordered script is present.
          app = Path('app.js')
          text = app.read_text(encoding='utf-8')
          text = text.replace("let originalLoaded = false;", "let originalLoaded = !!document.querySelector('script[data-v16-core]');")
          text = re.sub(r"script\.src = 'app-v14\.js\?v=[^']+';", f"script.src = 'app-v14.js?v={VERSION}';", text)
          for old, new in [
              ("v16-user-polish.css?v=16.6", f"v16-user-polish.css?v={VERSION}"),
              ("v16-release-polish.css?v=16.8", f"v16-release-polish.css?v={VERSION}"),
              ("v16-corrections.css?v=16.12", f"v16-corrections.css?v={VERSION}"),
              ("v16-final-lock.css?v=16.14", f"v16-final-lock.css?v={VERSION}"),
          ]:
              text = text.replace(old, new)
          text = text.replace("image:'media/legacy/spindle-interface.webp'", "image:'media/v16/images/spm-cnc-machines/transtech-motor-flange-facing-cnc-mc/20230327-120458.webp'")
          text = text.replace(
              "setText('.gallery-browser-head > p','Look from the complete machine down to fixtures, mechanisms, control panels and process details to judge how VSK executes real shop-floor engineering.');",
              "setText('.gallery-browser-head > p','Choose the engineering category closest to your requirement, then open the individual project groups to inspect machine construction, controls, mechanisms and process detail.');"
          )
          # Gallery summary belongs to the category renderer; do not overwrite it with image/video counts later.
          text = text.replace(
              "if(groups&&Number.isFinite(summary.groups))groups.textContent=`${summary.groups} project groups`;\n    if(images&&Number.isFinite(summary.images))images.textContent=`${summary.images} images`;\n    if(videos&&Number.isFinite(summary.videos))videos.textContent=`${summary.videos} videos`;",
              "if(page !== 'gallery'){\n      if(groups&&Number.isFinite(summary.groups))groups.textContent=`${summary.groups} project groups`;\n      if(images&&Number.isFinite(summary.images))images.textContent=`${summary.images} images`;\n      if(videos&&Number.isFinite(summary.videos))videos.textContent=`${summary.videos} videos`;\n    }"
          )
          app.write_text(text, encoding='utf-8')

          # Final lock fallbacks use the same release token.
          lock_js = Path('v16-final-lock.js')
          text = lock_js.read_text(encoding='utf-8')
          text = re.sub(r'v16-review-authority\.css\?v=[^\"\']+', f'v16-review-authority.css?v={VERSION}', text)
          text = re.sub(r'gallery-categories\.js\?v=[^\"\']+', f'gallery-categories.js?v={VERSION}', text)
          lock_js.write_text(text, encoding='utf-8')

          lock_css = Path('v16-final-lock.css')
          text = lock_css.read_text(encoding='utf-8')
          text = re.sub(r'v16-review-authority\.css\?v=[^\"\')]+', f'v16-review-authority.css?v={VERSION}', text)
          lock_css.write_text(text, encoding='utf-8')

          # Stable local first paint: no full-page loader, no flash of the 34 legacy Gallery filters.
          review = Path('v16-review-authority.css')
          text = review.read_text(encoding='utf-8')
          start = '/* V16.32 STABLE FIRST PAINT START */'
          end = '/* V16.32 STABLE FIRST PAINT END */'
          block = r'''
/* V16.32 STABLE FIRST PAINT START */
html body.v8.v13.v14 .projects-showcase{border-bottom:0!important}
html body.v8.v13.v14 .selected-projects-strip [data-home-projects]{min-height:272px!important}
html body.v8.v13.v14[data-page="gallery"] .gallery-controls{
  min-height:146px!important;
  visibility:hidden!important;
  opacity:0!important;
  pointer-events:none!important;
}
html body.v8.v13.v14[data-page="gallery"].gallery-categories-ready .gallery-controls{
  visibility:visible!important;
  opacity:1!important;
  pointer-events:auto!important;
  transition:opacity .16s ease!important;
}
html body.v8.v13.v14[data-page="gallery"] .gallery-hero-strip,
html body.v8.v13.v14[data-page="gallery"] .gallery-hero-shade{display:none!important}
/* V16.32 STABLE FIRST PAINT END */
'''
          if start in text and end in text:
              text = re.sub(re.escape(start) + r'.*?' + re.escape(end), block.strip(), text, flags=re.S)
          else:
              text += '\n' + block
          review.write_text(text, encoding='utf-8')

          # Keep deployment documentation from sending future work to the wrong branch.
          Path('DEPLOY-README.txt').write_text(
              'VSK V16 - GitHub Pages Review\n\n'
              'Development source: client-review-v16-blue-refinement / (root)\n'
              'GitHub Pages deployment mirror: client-review-v5 / (root)\n'
              'Review URL: https://arcanelinx-web-studio.github.io/VSK/\n\n'
              'Do not develop on client-review-v5. It is only the Pages mirror of the V16 review branch.\n',
              encoding='utf-8'
          )
          PY

      - name: Commit stable-load wiring when needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No normalization changes required"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html machines.html gallery.html app.js v16-final-lock.js v16-final-lock.css v16-review-authority.css DEPLOY-README.txt
            git commit -m "Stabilize V16 first paint across public pages"
            git push origin HEAD:client-review-v16-blue-refinement
          fi

      - name: Mirror approved V16 head to GitHub Pages branch
        shell: bash
        run: |
          git fetch origin client-review-v16-blue-refinement
          git checkout -B client-review-v16-blue-refinement origin/client-review-v16-blue-refinement
          git push --force origin HEAD:client-review-v5
