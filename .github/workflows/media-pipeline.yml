name: Build production media

on:
  push:
    branches: [main]
    paths:
      - 'assets-source/**'
      - 'scripts/media/**'
      - 'scripts/site/**'
      - '.github/workflows/media-pipeline.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vsk-media-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-media:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install media dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Generate optimized media
        run: python scripts/media/build_media.py

      - name: Wire optimized media into website
        run: python scripts/media/apply_media_paths.py

      - name: Apply production UX and SEO polish
        run: python scripts/site/apply_production_polish.py

      - name: Show media report
        run: |
          cat media/README.md
          du -sh media

      - name: Commit generated media and site wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add media index.html script.js 404.html _headers
          if git diff --cached --quiet; then
            echo 'No generated media or site wiring changes.'
            exit 0
          fi
          git commit -m 'chore: refresh production media and site wiring'
          git push

      - name: Upload media artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsk-production-media
          path: media/
          retention-days: 7
