name: V16 Final Step 2 Visual QA

on:
  push:
    branches: [client-review-v16-final-step2-working]
    paths:
      - '.github/workflows/v16-final-step2-preview.yml'
      - 'v16-final.css'
      - 'index.html'
      - 'app.js'
      - 'app-v14.js'
      - 'data.js'

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: client-review-v16-final-step2-working
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /index.html
            /styles.css
            /v16.css
            /v16-final.css
            /app.js
            /app-v14.js
            /data.js
            /media/**
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Start site
        run: |
          python3 -m http.server 4173 >/tmp/vsk-server.log 2>&1 &
          sleep 2
      - name: Render and validate Step 2
        run: |
          cat > visual-step2.cjs <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const wait = ms => new Promise(r=>setTimeout(r,ms));
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const checks=[]; const failures=[];
            for (const [name,width,height] of [['1440',1440,1000],['1366',1366,768],['mobile',390,844]]) {
              const page=await browser.newPage({viewport:{width,height},deviceScaleFactor:1});
              const pageErrors=[],badResponses=[];
              page.on('pageerror',e=>pageErrors.push(String(e)));
              page.on('response',r=>{if(r.status()>=400 && r.url().startsWith('http://127.0.0.1:4173/')) badResponses.push(`${r.status()} ${r.url()}`)});
              await page.goto('http://127.0.0.1:4173/index.html',{waitUntil:'networkidle'});

              await page.locator('.credibility-band').scrollIntoViewIfNeeded();
              await wait(250);
              await page.locator('.credibility-band').screenshot({path:`step2-proof-${name}.png`});

              await page.locator('.capabilities').scrollIntoViewIfNeeded();
              await wait(450);
              const second=page.locator('.capability-row').nth(1);
              await second.click();
              await wait(220);
              await page.locator('.capabilities').screenshot({path:`step2-capabilities-${name}.png`});

              const result=await page.evaluate(()=>{
                const root=document.documentElement;
                const proof=document.querySelector('.credibility-band');
                const cap=document.querySelector('.capabilities');
                const active=document.querySelector('.capability-row.is-active');
                const capTitle=document.querySelector('[data-capability-title]');
                const ownedImages=[...document.querySelectorAll('.credibility-band img,.capabilities img')];
                const broken=ownedImages.filter(i=>i.complete && i.naturalWidth===0).map(i=>i.src);
                const pending=ownedImages.filter(i=>!i.complete).map(i=>i.src);
                return {
                  viewport:innerWidth,
                  scrollWidth:root.scrollWidth,
                  proofBg:getComputedStyle(proof).backgroundColor,
                  capBg:getComputedStyle(cap).backgroundColor,
                  activeText:active?.innerText.replace(/\s+/g,' ').trim(),
                  activeBg:active ? getComputedStyle(active).backgroundColor : '',
                  capabilityTitle:capTitle?.innerText.trim(),
                  broken,pending
                };
              });
              const uniqueBad=[...new Set(badResponses)];
              checks.push({name,...result,pageErrors,badResponses:uniqueBad});
              if(result.scrollWidth>width+2) failures.push(`${name}: horizontal overflow ${result.scrollWidth}>${width}`);
              if(!result.proofBg.includes('244, 243, 238')) failures.push(`${name}: Step 2 credibility palette not applied ${result.proofBg}`);
              if(!result.capBg.includes('248, 247, 242')) failures.push(`${name}: Step 2 capability palette not applied ${result.capBg}`);
              if(!result.activeText?.includes('CNC / PLC / HMI')) failures.push(`${name}: capability interaction did not activate controls row`);
              if(result.broken.length) failures.push(`${name}: broken Step 2 images ${result.broken.join(', ')}`);
              if(result.pending.length) failures.push(`${name}: pending Step 2 media ${result.pending.join(', ')}`);
              if(pageErrors.length) failures.push(`${name}: page errors ${pageErrors.join(' | ')}`);
              if(uniqueBad.length) failures.push(`${name}: failed requests ${uniqueBad.join(' | ')}`);
              await page.close();
            }
            fs.writeFileSync('step2-report.json',JSON.stringify({checks,failures},null,2));
            console.log(fs.readFileSync('step2-report.json','utf8'));
            await browser.close();
            if(failures.length) process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node visual-step2.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v16-final-step2-preview
          path: |
            step2-*.png
            step2-report.json
          retention-days: 14
