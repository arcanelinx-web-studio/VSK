name: Apply V16 Final Launch Metadata Polish

on:
  push:
    branches: [client-review-v16-final-launch-polish]
    paths:
      - '.github/workflows/v16-final-launch-meta-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: client-review-v16-final-launch-polish
          fetch-depth: 0
      - name: Align public subpage browser theme color
        run: |
          python - <<'PY'
          from pathlib import Path
          pages=['projects.html','machines.html','gallery.html']
          old='<meta content="#0D1824" name="theme-color"/>'
          new='<meta content="#17201C" name="theme-color"/>'
          for name in pages:
              p=Path(name)
              s=p.read_text()
              if new in s:
                  print(f'{name}: already Final')
                  continue
              if old not in s:
                  raise SystemExit(f'{name}: expected legacy theme color not found')
              p.write_text(s.replace(old,new,1))
              print(f'{name}: updated')
          PY
      - name: Verify theme and preserve indexing lock
        run: |
          for f in projects.html machines.html gallery.html; do
            grep -q 'content="#17201C" name="theme-color"' "$f"
            grep -q 'content="noindex,nofollow" name="robots"' "$f"
          done
          grep -q 'content="noindex,nofollow" name="robots"' index.html
      - name: Commit and safely push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects.html machines.html gallery.html
          git commit -m 'Align V16 Final subpage browser theme color'
          git fetch origin client-review-v16-final-launch-polish
          git rebase origin/client-review-v16-final-launch-polish
          git push origin HEAD:client-review-v16-final-launch-polish
