name: V16 Final Step 5 Visual QA

on:
  push:
    branches: [client-review-v16-final-step5-working]
    paths:
      - '.github/workflows/v16-final-step5-preview.yml'
      - 'v16-step5.css'
      - 'v16-step4.css'
      - 'v16-step3.css'
      - 'v16-final.css'
      - 'index.html'
      - 'app.js'
      - 'app-v14.js'
      - 'data.js'

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: client-review-v16-final-step5-working
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /index.html
            /styles.css
            /v16.css
            /v16-final.css
            /v16-step3.css
            /v16-step4.css
            /v16-step5.css
            /app.js
            /app-v14.js
            /data.js
            /media/**
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Start site
        run: |
          python3 -m http.server 4173 >/tmp/vsk-server.log 2>&1 &
          sleep 2
      - name: Render and validate Step 5
        run: |
          cat > visual-step5.cjs <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const wait = ms => new Promise(r=>setTimeout(r,ms));
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const checks=[]; const failures=[];
            for (const [name,width,height] of [['1440',1440,1000],['1366',1366,768],['mobile',390,844]]) {
              const page=await browser.newPage({viewport:{width,height},deviceScaleFactor:1});
              const pageErrors=[],badResponses=[];
              page.on('pageerror',e=>pageErrors.push(String(e)));
              page.on('response',r=>{if(r.status()>=400 && r.url().startsWith('http://127.0.0.1:4173/')) badResponses.push(`${r.status()} ${r.url()}`)});
              await page.goto('http://127.0.0.1:4173/index.html',{waitUntil:'networkidle'});

              const retrofit=page.locator('#retrofit');
              await retrofit.scrollIntoViewIfNeeded();
              await wait(650);
              await page.evaluate(()=>document.activeElement?.blur());
              await retrofit.screenshot({path:`step5-retrofit-${name}.png`});

              await page.locator('#retrofit [data-feature-open="kellenberg"]').click();
              await wait(150);
              const dossier=await page.evaluate(()=>({
                hidden:document.querySelector('[data-dossier]')?.hidden,
                title:document.querySelector('[data-dossier-title]')?.textContent?.trim()||''
              }));
              if(dossier.hidden!==false || !/Kellenberg/i.test(dossier.title)) failures.push(`${name}: Kellenberg dossier did not open correctly (${dossier.title})`);
              await page.locator('[data-dossier-close]').last().click();
              await wait(100);

              const process=page.locator('.process');
              await process.scrollIntoViewIfNeeded();
              await wait(450);
              await page.evaluate(()=>document.activeElement?.blur());
              await process.screenshot({path:`step5-process-${name}.png`});

              const result=await page.evaluate(()=>{
                const root=document.documentElement;
                const retrofit=document.querySelector('#retrofit');
                const process=document.querySelector('.process');
                const em=retrofit.querySelector('h2 em');
                const progress=process.querySelector('[data-process-progress]');
                const stages=[...process.querySelectorAll('.process-line article')].map(a=>({
                  no:a.querySelector('span')?.textContent.trim()||'',
                  title:a.querySelector('strong')?.textContent.trim()||'',
                  text:a.querySelector('p')?.textContent.trim()||''
                }));
                const video=retrofit.querySelector('video');
                const sources=[...video.querySelectorAll('source')].map(s=>s.getAttribute('src')||s.getAttribute('data-src')||'');
                return {
                  viewport:innerWidth,
                  scrollWidth:root.scrollWidth,
                  linked:[...document.styleSheets].some(s=>(s.href||'').includes('v16-step5.css')),
                  retrofitBg:getComputedStyle(retrofit).backgroundColor,
                  retrofitAccent:getComputedStyle(em).color,
                  processBg:getComputedStyle(process).backgroundColor,
                  progressBg:getComputedStyle(progress).backgroundColor,
                  stageCount:stages.length,
                  stages,
                  poster:video.getAttribute('poster')||'',
                  sources,
                  retrofitHref:retrofit.querySelector('a[href*="type=retrofit"]')?.getAttribute('href')||''
                };
              });
              const uniqueBad=[...new Set(badResponses)];
              checks.push({name,...result,dossier,pageErrors,badResponses:uniqueBad});
              if(!result.linked) failures.push(`${name}: v16-step5.css is not linked`);
              if(result.scrollWidth>width+2) failures.push(`${name}: horizontal overflow ${result.scrollWidth}>${width}`);
              if(!result.retrofitBg.includes('16, 23, 19')) failures.push(`${name}: retrofit dark green-charcoal palette not applied ${result.retrofitBg}`);
              if(result.retrofitAccent.includes('134, 199, 245') || result.retrofitAccent.includes('120, 185, 239')) failures.push(`${name}: legacy blue retrofit accent remains ${result.retrofitAccent}`);
              if(!result.processBg.includes('248, 247, 242')) failures.push(`${name}: process warm palette not applied ${result.processBg}`);
              if(!result.progressBg.includes('40, 95, 80')) failures.push(`${name}: process progress is not VSK green ${result.progressBg}`);
              if(result.stageCount!==6) failures.push(`${name}: expected six process stages, got ${result.stageCount}`);
              const expected='01 Understand|02 Engineer|03 Build|04 Program|05 Validate|06 Commission';
              const actual=result.stages.map(s=>`${s.no} ${s.title}`).join('|');
              if(actual!==expected) failures.push(`${name}: process sequence changed ${actual}`);
              if(result.poster!=='media/motion/kellenberg-loop-poster.webp') failures.push(`${name}: Kellenberg poster changed ${result.poster}`);
              if(!result.sources.some(s=>s.includes('kellenberg-loop.webm')) || !result.sources.some(s=>s.includes('kellenberg-loop.mp4'))) failures.push(`${name}: Kellenberg motion sources missing ${result.sources.join(',')}`);
              if(result.retrofitHref!=='machines.html?type=retrofit') failures.push(`${name}: retrofit archive href changed ${result.retrofitHref}`);
              if(pageErrors.length) failures.push(`${name}: page errors ${pageErrors.join(' | ')}`);
              if(uniqueBad.length) failures.push(`${name}: failed requests ${uniqueBad.join(' | ')}`);
              await page.close();
            }
            fs.writeFileSync('step5-report.json',JSON.stringify({checks,failures},null,2));
            console.log(fs.readFileSync('step5-report.json','utf8'));
            await browser.close();
            if(failures.length) process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node visual-step5.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v16-final-step5-preview
          path: |
            step5-*.png
            step5-report.json
          retention-days: 14
