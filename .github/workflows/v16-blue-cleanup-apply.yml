name: Apply V16 Blue Cleanup
on:
  push:
    branches:
      - client-review-v16-blue-refinement
    paths:
      - .github/workflows/v16-blue-cleanup-apply.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: client-review-v16-blue-refinement
          fetch-depth: 0
      - name: Apply final palette cleanup
        run: python3 .github/scripts/v16_blue_cleanup.py
      - name: Commit and safely push
        shell: bash
        run: |
          git config user.name "Asmita G V"
          git config user.email "gujjarasmita@gmail.com"
          git add index.html v16-blue-refinement.css
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Finish V16 blue palette cleanup and hero polish"
          git pull --rebase origin client-review-v16-blue-refinement
          git push origin HEAD:client-review-v16-blue-refinement
