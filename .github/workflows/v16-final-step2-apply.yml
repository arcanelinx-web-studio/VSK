name: Apply V16 Final Step 2

on:
  push:
    branches: [client-review-v16-final-step2-working]
    paths:
      - '.github/workflows/v16-final-step2-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: client-review-v16-final-step2-working
          fetch-depth: 0
      - name: Apply credibility and capability refinement
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('v16-final.css')
          s=p.read_text()
          marker='/* V16 Final — Step 2: credibility + capabilities */'
          if marker in s:
              raise SystemExit('Step 2 marker already present; nothing to apply.')
          step2=r'''

/* V16 Final — Step 2: credibility + capabilities
   Continue the Step 1 warm industrial system into proof and engineering depth. */
body.v8.v13.v14 .credibility-band{
  background:var(--vsk-ivory);
  border-top:1px solid var(--vsk-line);
  border-bottom:1px solid var(--vsk-line);
}
body.v8.v13.v14 .credibility-band .proof-grid{
  border-bottom:1px solid var(--vsk-line);
}
body.v8.v13.v14 .credibility-band .proof-grid article{
  min-height:142px;
  padding-top:28px;
  padding-bottom:27px;
  border-right-color:var(--vsk-line);
}
body.v8.v13.v14 .credibility-band .proof-grid span{
  color:var(--vsk-green);
  font-size:8.5px;
  letter-spacing:.14em;
}
body.v8.v13.v14 .credibility-band .proof-grid strong{
  margin:10px 0 8px;
  color:var(--vsk-charcoal);
  font-size:clamp(2.6rem,3.35vw,4rem);
  font-weight:600;
  letter-spacing:-.055em;
}
body.v8.v13.v14 .credibility-band .proof-grid small{
  color:var(--vsk-muted);
  font-size:11px;
  line-height:1.45;
}
body.v8.v13.v14 .credibility-band .customer-row{
  min-height:70px;
  color:var(--vsk-charcoal);
}
body.v8.v13.v14 .credibility-band .customer-row>span{
  color:var(--vsk-muted);
  font-size:8.5px;
  letter-spacing:.14em;
}
body.v8.v13.v14 .credibility-band .customer-row a{
  position:relative;
  color:#35403b;
  font-family:var(--display);
  font-size:13px;
  font-weight:500;
  letter-spacing:-.015em;
  transition:color .2s ease;
}
body.v8.v13.v14 .credibility-band .customer-row a::after{
  content:"";
  position:absolute;
  left:0;
  right:100%;
  bottom:-6px;
  height:1px;
  background:var(--vsk-green);
  transition:right .22s ease;
}
body.v8.v13.v14 .credibility-band .customer-row a:hover{color:var(--vsk-green)}
body.v8.v13.v14 .credibility-band .customer-row a:hover::after{right:0}

body.v8.v13.v14 .capabilities{
  background:#f8f7f2;
  color:var(--vsk-charcoal);
  padding-bottom:clamp(82px,7.5vw,116px);
}
body.v8.v13.v14 .capabilities .section-intro{
  padding-top:clamp(82px,7.2vw,110px);
  margin-bottom:clamp(38px,3.8vw,54px);
}
body.v8.v13.v14 .capabilities .section-intro>.kicker{
  color:var(--vsk-green);
}
body.v8.v13.v14 .capabilities .section-intro h2{
  color:var(--vsk-charcoal);
  font-weight:600;
  letter-spacing:-.058em;
}
body.v8.v13.v14 .capabilities .section-intro h2 em{color:var(--vsk-green)}
body.v8.v13.v14 .capabilities .section-intro p{
  color:var(--vsk-muted);
  line-height:1.72;
}
body.v8.v13.v14 .capability-layout{
  grid-template-columns:minmax(0,.86fr) minmax(0,1.14fr);
  gap:clamp(54px,5.3vw,84px);
  align-items:start;
}
body.v8.v13.v14 .capability-list{
  border-top:1px solid #aeb5b0;
}
body.v8.v13.v14 .capability-row{
  position:relative;
  min-height:70px;
  grid-template-columns:48px minmax(0,1fr) 30px;
  border-bottom:1px solid #cfd3cf;
  color:#6f7772;
  transition:color .2s ease,background .2s ease,box-shadow .2s ease,padding .2s ease;
}
body.v8.v13.v14 .capability-row span{
  color:#7d8580;
  font-size:9px;
  letter-spacing:.08em;
}
body.v8.v13.v14 .capability-row strong{
  font-size:clamp(18px,1.48vw,23px);
  font-weight:500;
  color:inherit;
}
body.v8.v13.v14 .capability-row i{
  color:var(--vsk-green);
  font-size:18px;
}
body.v8.v13.v14 .capability-row:hover{
  color:var(--vsk-charcoal);
  background:rgba(40,95,80,.035);
}
body.v8.v13.v14 .capability-row.is-active{
  color:var(--vsk-charcoal);
  border-bottom-color:#9eb0a8;
  background:rgba(40,95,80,.055);
  box-shadow:inset 3px 0 0 var(--vsk-green);
  padding-left:14px;
}
body.v8.v13.v14 .capability-row.is-active span{color:var(--vsk-green)}
body.v8.v13.v14 .capability-row.is-active i{transform:translateX(2px);opacity:1}
body.v8.v13.v14 .capability-media{
  top:100px;
}
body.v8.v13.v14 .capability-media .media-frame{
  aspect-ratio:16/10;
  border:1px solid #c7ccc8;
  background:var(--vsk-stone);
  box-shadow:0 24px 58px rgba(26,34,30,.075);
}
body.v8.v13.v14 .capability-media .media-frame img{
  filter:saturate(.84) contrast(1.015);
}
body.v8.v13.v14 .capability-media figcaption{
  padding-top:18px;
}
body.v8.v13.v14 .capability-media figcaption>span{
  color:var(--vsk-green);
  font-size:9px;
  letter-spacing:.1em;
}
body.v8.v13.v14 .capability-media figcaption>strong{
  color:var(--vsk-charcoal);
  margin:8px 0 7px;
  font-size:clamp(20px,1.75vw,27px);
  line-height:1.12;
  font-weight:500;
}
body.v8.v13.v14 .capability-media figcaption>p{
  max-width:680px;
  color:var(--vsk-muted);
  font-size:13px;
  line-height:1.6;
}
body.v8.v13.v14 .capability-media .tag-row{
  margin-top:15px;
  gap:7px;
}
body.v8.v13.v14 .capability-media .tag-row b{
  border-color:#b7c1bc;
  color:var(--vsk-green-dark);
  background:rgba(255,255,255,.35);
  font-size:8px;
  letter-spacing:.09em;
}

@media (max-width:1024px){
  body.v8.v13.v14 .capabilities .section-intro{
    display:block;
    padding-top:72px;
    margin-bottom:32px;
  }
  body.v8.v13.v14 .capabilities .section-intro h2{margin-top:10px}
  body.v8.v13.v14 .capabilities .section-intro p{margin-top:18px;max-width:760px}
  body.v8.v13.v14 .capability-layout{grid-template-columns:1fr;gap:34px}
  body.v8.v13.v14 .capability-media{position:static;top:auto}
}

@media (max-width:700px){
  body.v8.v13.v14 .credibility-band .proof-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
  body.v8.v13.v14 .credibility-band .proof-grid article{
    min-height:124px;
    padding:20px 14px 18px 0;
    border-bottom:1px solid var(--vsk-line);
  }
  body.v8.v13.v14 .credibility-band .proof-grid article:nth-child(even){
    padding-left:14px;
    padding-right:0;
    border-right:0;
  }
  body.v8.v13.v14 .credibility-band .proof-grid article:nth-last-child(-n+2){border-bottom:0}
  body.v8.v13.v14 .credibility-band .proof-grid strong{font-size:2.55rem}
  body.v8.v13.v14 .credibility-band .proof-grid small{font-size:10px}
  body.v8.v13.v14 .credibility-band .customer-row{
    min-height:0;
    grid-template-columns:repeat(2,minmax(0,1fr));
    padding-top:18px;
    padding-bottom:20px;
  }
  body.v8.v13.v14 .credibility-band .customer-row a{
    font-size:12px;
    overflow-wrap:anywhere;
  }
  body.v8.v13.v14 .credibility-band .customer-row a::after{display:none}

  body.v8.v13.v14 .capabilities{padding-bottom:74px}
  body.v8.v13.v14 .capabilities .section-intro{padding-top:62px;margin-bottom:26px}
  body.v8.v13.v14 .capabilities .section-intro h2{
    font-size:clamp(2.55rem,11vw,3.45rem);
    line-height:.95;
  }
  body.v8.v13.v14 .capabilities .section-intro p{font-size:14px;line-height:1.62}
  body.v8.v13.v14 .capability-layout{gap:30px}
  body.v8.v13.v14 .capability-row{
    min-height:62px;
    grid-template-columns:40px minmax(0,1fr) 22px;
  }
  body.v8.v13.v14 .capability-row strong{font-size:18px}
  body.v8.v13.v14 .capability-row.is-active{padding-left:10px;box-shadow:inset 2px 0 0 var(--vsk-green)}
  body.v8.v13.v14 .capability-media .media-frame{aspect-ratio:4/3;box-shadow:0 18px 38px rgba(26,34,30,.06)}
  body.v8.v13.v14 .capability-media figcaption>strong{font-size:21px}
}
'''
          p.write_text(s.rstrip()+step2+'\n')
          PY
      - name: Verify Step 2 markers
        run: |
          grep -q 'V16 Final — Step 2: credibility + capabilities' v16-final.css
          grep -q 'body.v8.v13.v14 .credibility-band' v16-final.css
          grep -q 'body.v8.v13.v14 .capability-row.is-active' v16-final.css
      - name: Commit Step 2
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v16-final.css
          git commit -m 'Refine V16 Final credibility and capabilities' || exit 0
          git push origin HEAD:client-review-v16-final-step2-working
