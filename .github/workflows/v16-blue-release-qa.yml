name: V16 Blue Release QA
on:
  push:
    branches:
      - client-review-v16-blue-refinement
    paths:
      - .github/workflows/v16-blue-release-qa.yml
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: client-review-v16-blue-refinement
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /index.html
            /projects.html
            /machines.html
            /gallery.html
            /404.html
            /styles.css
            /v16.css
            /v16-final.css
            /v16-step3.css
            /v16-step4.css
            /v16-step5.css
            /v16-step6.css
            /v16-subpages.css
            /v16-blue-refinement.css
            /app.js
            /app-v14.js
            /data.js
            /media/**
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Start site
        run: |
          python3 -m http.server 4173 >/tmp/vsk-blue-release.log 2>&1 &
          sleep 2
      - name: Validate final website
        run: |
          cat > release-qa.cjs <<'JS'
          const { chromium }=require('playwright');
          const fs=require('fs');
          const pause=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const failures=[],checks=[];
            const files=['index.html','projects.html','machines.html','gallery.html','404.html'];
            const vps=[['desktop',1440,1000],['mobile',390,844]];
            const green=['40, 95, 80','159, 194, 181'];
            for(const file of files){
              for(const [mode,width,height] of vps){
                const page=await browser.newPage({viewport:{width,height}});
                const errors=[],bad=[];
                page.on('pageerror',e=>errors.push(String(e)));
                page.on('response',r=>{if(r.status()>=400&&r.url().startsWith('http://127.0.0.1:4173/'))bad.push(`${r.status()} ${r.url()}`)});
                await page.goto('http://127.0.0.1:4173/'+file,{waitUntil:'networkidle'});
                await pause(500);
                const initial=await page.evaluate(green=>{
                  const visible=[...document.querySelectorAll('body *')].filter(el=>el.offsetParent!==null);
                  const survivors=[];
                  for(const el of visible){
                    const s=getComputedStyle(el);
                    const vals=[s.color,s.backgroundColor,s.borderTopColor,s.borderRightColor,s.borderBottomColor,s.borderLeftColor,s.boxShadow];
                    if(vals.some(v=>green.some(g=>v.includes(g)))) survivors.push({el:el.tagName+'.'+String(el.className||''),vals});
                    if(survivors.length>=12)break;
                  }
                  return {
                    width:document.documentElement.scrollWidth,
                    theme:document.querySelector('meta[name="theme-color"]')?.content||'',
                    robots:document.querySelector('meta[name="robots"]')?.content||'',
                    survivors
                  };
                },green);
                if(initial.width>width+2)failures.push(`${file}/${mode}: overflow ${initial.width}>${width}`);
                if(initial.theme.toUpperCase()!=='#0D1824')failures.push(`${file}/${mode}: theme ${initial.theme}`);
                if(!initial.robots.includes('noindex'))failures.push(`${file}/${mode}: review indexing lock missing`);
                if(initial.survivors.length)failures.push(`${file}/${mode}: legacy green visible ${JSON.stringify(initial.survivors.slice(0,4))}`);

                if(file==='index.html'){
                  const hero=await page.evaluate(()=>{
                    const a=document.querySelector('.hero-blue-copy h1 span'),b=document.querySelector('.hero-blue-copy h1 em');
                    const main=document.querySelector('.hero-board-main img'),secondary=document.querySelector('.hero-board-photo img');
                    const board=document.querySelector('.hero-engineering-board');
                    return {
                      text:(a?.textContent||'')+' '+(b?.textContent||''),
                      white:a?getComputedStyle(a).color:'',blue:b?getComputedStyle(b).color:'',
                      mainSrc:main?.getAttribute('src')||'',secondarySrc:secondary?.getAttribute('src')||'',
                      mainOk:!!main&&main.complete&&main.naturalWidth>0,secondaryOk:!!secondary&&secondary.complete&&secondary.naturalWidth>0,
                      boardW:board?Math.round(board.getBoundingClientRect().width):0,
                      tag:document.querySelector('.hero-board-tag')?.textContent.trim()||'',
                      proof:document.querySelector('.hero-proof-chip')?.textContent.trim()||''
                    }
                  });
                  if(!hero.text.includes('Engineered around your production.'))failures.push(`home/${mode}: headline ${hero.text}`);
                  if(!hero.white.includes('255, 255, 255')||!hero.blue.includes('69, 169, 232'))failures.push(`home/${mode}: white/blue headline split ${hero.white}/${hero.blue}`);
                  if(!hero.mainSrc.includes('4-servo-seal-slotting-machine/slotting-mc-1.webp'))failures.push(`home/${mode}: CAD visual wrong ${hero.mainSrc}`);
                  if(!hero.secondarySrc.includes('slotting-detail.webp'))failures.push(`home/${mode}: secondary project image wrong ${hero.secondarySrc}`);
                  if(!hero.mainOk||!hero.secondaryOk)failures.push(`home/${mode}: hero media failed ${JSON.stringify(hero)}`);
                  if(!hero.tag.includes('04 SERVO')||!hero.tag.includes('SPM'))failures.push(`home/${mode}: technical tag ${hero.tag}`);
                  if(!hero.proof.includes('300+'))failures.push(`home/${mode}: proof missing`);
                  if(mode==='desktop'&&hero.boardW<480)failures.push(`home desktop: board too small ${hero.boardW}`);
                  if(mode==='desktop'){
                    await page.locator('.hero').screenshot({path:'release-hero-desktop.png'});
                    await page.locator('.capabilities').scrollIntoViewIfNeeded();await pause(250);await page.locator('.capabilities').screenshot({path:'release-capabilities-desktop.png'});
                    await page.locator('.engineering-depth').scrollIntoViewIfNeeded();await pause(250);await page.locator('.engineering-depth').screenshot({path:'release-proof-desktop.png'});
                    await page.locator('.retrofit').scrollIntoViewIfNeeded();await pause(250);await page.locator('.retrofit').screenshot({path:'release-retrofit-desktop.png'});
                    await page.locator('.contact').scrollIntoViewIfNeeded();await pause(250);await page.locator('.contact').screenshot({path:'release-contact-desktop.png'});
                  } else {
                    await page.locator('.hero').screenshot({path:'release-hero-mobile.png'});
                  }
                  const quote=page.locator('[data-quote-open]:visible').first();
                  if(await quote.count()){
                    await quote.click();await pause(120);
                    const q=await page.evaluate(()=>({hidden:document.querySelector('[data-quote-panel]')?.hidden,active:getComputedStyle(document.querySelector('.quote-progress i.is-active')).backgroundColor}));
                    if(q.hidden!==false)failures.push(`home/${mode}: quote dialog failed`);
                    if(!q.active.includes('22, 123, 196'))failures.push(`home/${mode}: quote progress not blue ${q.active}`);
                    const close=page.locator('.quote-close[data-quote-close]');if(await close.isVisible())await close.click();
                  }
                }

                if(file==='projects.html'){
                  await page.locator('.project-index').scrollIntoViewIfNeeded();await pause(450);
                  const cards=await page.locator('.project-page-card').count();if(cards<5)failures.push(`projects/${mode}: only ${cards} cards`);
                  if(mode==='desktop')await page.locator('.page-hero').screenshot({path:'release-projects-hero.png'});
                }
                if(file==='machines.html'){
                  await page.locator('.archive-browser').scrollIntoViewIfNeeded();await pause(500);
                  const count=(await page.locator('[data-result-count]').textContent()||'').trim();if(!count.startsWith('54'))failures.push(`archive/${mode}: count ${count}`);
                  if(mode==='desktop')await page.locator('.archive-hero').screenshot({path:'release-archive-hero.png'});
                }
                if(file==='gallery.html'){
                  await page.locator('.gallery-browser').scrollIntoViewIfNeeded();await pause(700);
                  const tiles=await page.locator('.gallery-tile').count();if(tiles<1)failures.push(`gallery/${mode}: no tiles`);
                  if(mode==='desktop')await page.locator('.gallery-hero').screenshot({path:'release-gallery-hero.png'});
                }
                if(file==='404.html')await page.screenshot({path:`release-404-${mode}.png`,fullPage:true});

                await page.evaluate(async()=>{const h=document.documentElement.scrollHeight,step=Math.max(500,Math.floor(innerHeight*.72));for(let y=0;y<h;y+=step){scrollTo(0,y);await new Promise(r=>setTimeout(r,65));}scrollTo(0,h)});
                await pause(file==='gallery.html'?1500:600);
                const end=await page.evaluate(()=>{
                  const imgs=[...document.images].filter(i=>i.offsetParent!==null);
                  return {width:document.documentElement.scrollWidth,broken:imgs.filter(i=>i.complete&&i.naturalWidth===0).map(i=>i.src),pending:imgs.filter(i=>!i.complete).map(i=>i.src)};
                });
                if(end.width>width+2)failures.push(`${file}/${mode}: final overflow ${end.width}>${width}`);
                if(end.broken.length)failures.push(`${file}/${mode}: broken media ${end.broken.join(',')}`);
                if(end.pending.length)failures.push(`${file}/${mode}: pending media ${end.pending.join(',')}`);
                if(errors.length)failures.push(`${file}/${mode}: JS ${errors.join(' | ')}`);
                const unique=[...new Set(bad)];if(unique.length)failures.push(`${file}/${mode}: requests ${unique.join(' | ')}`);
                checks.push({file,mode,initial,end,errors,bad:unique});
                await page.close();
              }
            }
            const all=['index.html','projects.html','machines.html','gallery.html'].map(f=>fs.readFileSync(f,'utf8')).join('\n');
            for(const phrase of ['giving buyers a practical way','Use the index for technical depth','Browse each project as a complete visual chapter','Explore selected machines and retrofits through the application'])if(all.includes(phrase))failures.push(`copy audit: ${phrase}`);
            fs.writeFileSync('release-report.json',JSON.stringify({failures,checks},null,2));
            console.log(JSON.stringify({failures},null,2));
            await browser.close();if(failures.length)process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node release-qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v16-blue-release-preview
          path: |
            release-*.png
            release-report.json
          retention-days: 14
          if-no-files-found: warn
