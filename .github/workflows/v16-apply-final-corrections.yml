name: Apply Final V16 Corrections
on:
  push:
    branches: [client-review-v16-blue-refinement]
    paths: ['.github/workflows/v16-apply-final-corrections.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: client-review-v16-blue-refinement
          fetch-depth: 1
      - name: Apply final layout, copy and interaction corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          css=Path('v16-user-polish.css'); s=css.read_text(); marker='/* VSK FINAL SITE SCAN 2026-08-20 */'
          if marker not in s:
            s += r'''

/* VSK FINAL SITE SCAN 2026-08-20 */
@media (min-width:1181px){
  body.v8.v13.v14 .shell{width:min(1680px,calc(100% - 64px))!important}
  body.v8.v13.v14 .site-header{padding-inline:max(32px,calc((100vw - 1680px)/2))!important}
  body.v8.v13.v14 .hero-blue-layout{grid-template-columns:minmax(0,620px) minmax(500px,620px)!important;gap:72px!important;justify-content:center!important;padding-block:42px!important}
  body.v8.v13.v14 .hero-blue-copy{max-width:620px!important}
  body.v8.v13.v14 .hero-blue-copy>p{width:100%!important;max-width:620px!important}
  body.v8.v13.v14 .hero-actions{width:min(600px,100%)!important;display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:12px!important;margin:28px auto 0!important}
