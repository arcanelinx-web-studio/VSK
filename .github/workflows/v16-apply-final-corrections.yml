  body.v8.v13.v14 .hero-chips{width:min(620px,100%)!important;margin:18px auto 0!important;justify-content:center!important}
  body.v8.v13.v14 .hero-engineering-board{width:100%!important;max-width:620px!important;height:clamp(500px,62vh,590px)!important}
  body.v8.v13.v14 .engineering-depth{padding-block:70px!important}
  body.v8.v13.v14 .engineering-depth .depth-head{padding-bottom:22px!important;margin-bottom:18px!important;gap:56px!important}
  body.v8.v13.v14 .engineering-depth .depth-head h2{font-size:clamp(52px,3.7vw,66px)!important;line-height:.98!important}
  body.v8.v13.v14 .engineering-depth .depth-grid{grid-template-columns:minmax(0,1.58fr) minmax(380px,.78fr)!important;gap:20px!important}
  body.v8.v13.v14 .engineering-depth .metric-stack,body.v8.v13.v14 .engineering-depth .archive-callout{height:430px!important;min-height:430px!important}
  body.v8.v13.v14 .engineering-depth .metric-card{grid-template-columns:190px minmax(0,1fr) 22px!important;gap:20px!important;padding:0 26px!important}
  body.v8.v13.v14 .engineering-depth .metric-number{font-size:70px!important}
  body.v8.v13.v14 .engineering-depth .metric-card strong{font-size:17px!important}
  body.v8.v13.v14 .engineering-depth .archive-callout{padding:32px 34px!important}
  body.v8.v13.v14 .archive-callout-number{font-size:82px!important;margin:18px 0!important}
  body.v8.v13.v14 .archive-callout h3{font-size:28px!important;line-height:1.06!important}
  body.v8.v13.v14 .archive-callout>p{font-size:15px!important;line-height:1.5!important;margin:14px 0 16px!important}
  body.v8.v13.v14 .archive-callout .btn{min-height:48px!important;margin-top:16px!important}
  body.v8.v13.v14 .page-hero-projects{height:500px!important;min-height:500px!important;max-height:500px!important}
  body.v8.v13.v14 .page-hero-projects .page-hero-copy h1{font-size:clamp(62px,4.3vw,78px)!important;line-height:.95!important}
  body.v8.v13.v14 .project-index{padding-block:72px!important}
  body.v8.v13.v14 .project-index .section-intro{margin-bottom:42px!important}
  body.v8.v13.v14 .project-page-grid{gap:18px!important}
  body.v8.v13.v14 .project-page-media{height:280px!important;min-height:280px!important;max-height:280px!important}
  body.v8.v13.v14 .project-page-card.project-layout-0 .project-page-media{height:320px!important;min-height:320px!important;max-height:320px!important}
  body.v8.v13.v14 .project-page-copy{padding:20px 22px 22px!important}
  body.v8.v13.v14 .project-page-copy h3{font-size:clamp(25px,2vw,34px)!important}
  body.v8.v13.v14 .project-page-copy p{font-size:14px!important;line-height:1.5!important}
  body.v8.v13.v14 .additional-media{padding-block:72px!important}
  body.v8.v13.v14 .archive-hero{min-height:390px!important;max-height:430px!important}
  body.v8.v13.v14 .archive-hero-grid{grid-template-columns:205px minmax(0,1fr)!important;gap:42px!important}
  body.v8.v13.v14 .archive-hero-number span{font-size:96px!important}
  body.v8.v13.v14 .archive-hero-number small{margin-top:18px!important}
  body.v8.v13.v14 .archive-browser{padding-block:64px!important}
  body.v8.v13.v14 .archive-index-layout{grid-template-columns:minmax(0,1fr) 400px!important;gap:24px!important}
  body.v8.v13.v14 .archive-row{min-height:68px!important}
  body.v8.v13.v14 .archive-sticky-preview{max-width:400px!important;padding:16px!important;top:118px!important}
  body.v8.v13.v14 .archive-preview-media{margin-bottom:16px!important}
  body.v8.v13.v14 .archive-sticky-preview h2{font-size:27px!important;margin:8px 0 10px!important}
  body.v8.v13.v14 .archive-sticky-preview>p{font-size:14px!important;margin-bottom:16px!important}
  body.v8.v13.v14 [data-archive-preview-open]{min-height:48px!important}
  body.v8.v13.v14 .dossier[hidden]{display:none!important}
  body.v8.v13.v14 .dossier:not([hidden]){display:block!important;opacity:1!important;visibility:visible!important}
  body.v8.v13.v14 .dossier-panel{width:min(620px,44vw)!important;transform:none!important;opacity:1!important;visibility:visible!important}
  body.v8.v13.v14 .dossier-top{height:64px!important;min-height:64px!important}
  body.v8.v13.v14 .dossier-grid{height:calc(100dvh - 64px)!important}
  body.v8.v13.v14 .dossier-media{min-height:230px!important;max-height:34vh!important;padding:16px!important}
  body.v8.v13.v14 .dossier-media-item{min-height:210px!important;max-height:300px!important}
  body.v8.v13.v14 .dossier-copy{padding:24px 28px 36px!important}
  body.v8.v13.v14 .dossier-copy h2{font-size:34px!important}
  body.v8.v13.v14 .gallery-hero{height:430px!important;min-height:430px!important;max-height:430px!important}
  body.v8.v13.v14 .gallery-browser{padding-block:64px!important}
  body.v8.v13.v14 .gallery-browser-head{margin-bottom:36px!important}
  body.v8.v13.v14 .gallery-groups{gap:36px!important}
  body.v8.v13.v14 .gallery-project-group{padding-bottom:28px!important}
  body.v8.v13.v14 .gallery-project-group header{margin-bottom:14px!important}
  body.v8.v13.v14 .gallery-project-group header h3{font-size:27px!important}
  body.v8.v13.v14 .gallery-project-media{grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:12px!important}
  body.v8.v13.v14 .gallery-tile{aspect-ratio:16/10!important;max-height:270px!important}
}
@media (min-width:1181px) and (max-width:1499px){
  body.v8.v13.v14 .hero-blue-layout{grid-template-columns:minmax(0,560px) minmax(480px,560px)!important;gap:52px!important}
  body.v8.v13.v14 .hero-blue-copy,body.v8.v13.v14 .hero-blue-copy>p{max-width:560px!important}
  body.v8.v13.v14 .hero-actions{width:min(540px,100%)!important}
  body.v8.v13.v14 .hero-chips{width:min(560px,100%)!important}
  body.v8.v13.v14 .hero-engineering-board{max-width:560px!important;height:510px!important}
  body.v8.v13.v14 .engineering-depth .metric-stack,body.v8.v13.v14 .engineering-depth .archive-callout{height:405px!important;min-height:405px!important}
  body.v8.v13.v14 .engineering-depth .metric-card{grid-template-columns:160px minmax(0,1fr) 20px!important;padding:0 22px!important}
  body.v8.v13.v14 .engineering-depth .metric-number{font-size:62px!important}
  body.v8.v13.v14 .gallery-project-media{grid-template-columns:repeat(3,minmax(0,1fr))!important}
  body.v8.v13.v14 .gallery-tile{max-height:250px!important}
}
@media (max-width:1180px){body.v8.v13.v14 .project-page-media{height:250px!important;min-height:250px!important;max-height:250px!important}body.v8.v13.v14 .gallery-tile{aspect-ratio:4/3!important}}
@media (max-width:640px){body.v8.v13.v14 .hero-actions{width:100%!important;display:flex!important;margin-top:24px!important}body.v8.v13.v14 .hero-chips{width:100%!important}body.v8.v13.v14 .engineering-depth .metric-stack{border:0!important;background:transparent!important}body.v8.v13.v14 .engineering-depth .metric-card{min-height:118px!important}body.v8.v13.v14 .project-page-media{height:220px!important;min-height:220px!important;max-height:220px!important}body.v8.v13.v14 .dossier-panel{width:100vw!important}}
'''
            css.write_text(s)

          app=Path('app.js'); a=app.read_text()
          repl={
          'Bring VSK the part, cycle, tolerance or machine problem. We engineer the mechanics, controls and process around the production result you need — from a new SPM to automation or CNC retrofit.':'Bring VSK the part, cycle-time target, tolerance or machine challenge. We develop the mechanics, controls and process around the production result you need — whether that means a purpose-built SPM, automation or a CNC retrofit.',
          'Judge how VSK approaches a difficult application: from workholding and machine architecture to controls, cycle and the finished production solution.':'See how VSK turns a difficult production requirement into a working machine by aligning workholding, mechanism, controls and cycle from the start.',
          'Compare proven tolerance, alignment and cycle-time references with the demands of your own application — then search 54 documented machine and retrofit references.':'Use proven tolerance, alignment and cycle-time references to assess VSK against your own requirement, then search 54 documented machine and retrofit projects for the closest precedent.',
          'Find experience relevant to your process, machine type, application or control platform before you start a new requirement.':'Search by process, machine type, application or control platform to find the most relevant VSK experience before you brief a new project.',
          'If your requirement is unusual, start with machines VSK has already delivered. Compare applications, controls and machine configurations to judge where our experience matches your production challenge.':'Start with machines VSK has already delivered and compare applications, controls and configurations to find the strongest precedent for your production requirement.',
          'Use these completed cases to compare machine architecture, controls, workholding and application fit before discussing your own requirement.':'Compare completed machines by application, architecture, controls and workholding to see where VSK experience aligns with the result you need.',
          'Search 54 documented machine-building and retrofit references to find experience close to your process, machine type, customer application or control platform.':'Search 54 documented machine and retrofit references by process, machine type, application and control platform to find the experience most relevant to your requirement.',
          'Inspect VSK workmanship up close — machine construction, retrofit detail, fixtures, controls and process equipment from real project groups.':'Inspect real VSK project media to judge machine construction, retrofit quality, fixtures, controls and integration detail before you discuss your own requirement.'}
          for o,n in repl.items(): a=a.replace(o,n)
          app.write_text(a)

          av=Path('app-v14.js'); v=av.read_text(); anchor="  function genericFeature(m){\n"
          if 'function buyerReferenceSummary(m)' not in v:
            v=v.replace(anchor,"  function buyerReferenceSummary(m){\n    const application=categoryNames[m.category]||m.category||'machine engineering';\n    const control=m.control?` using ${m.control}`:'';\n    return `${m.title} is a documented VSK ${application.toLowerCase()} reference${control}. Use it to compare application fit, machine configuration and controls with your own requirement.`;\n  }\n"+anchor,1)
          v=v.replace("      summary:m.note||`${m.title} forms part of VSK’s machine-building and retrofit experience.`,","      summary:buyerReferenceSummary(m),")
          v=v.replace("""      sections:[\n        ['Engineering scope',m.note||`Relevant experience across ${categoryNames[m.category]||m.category} applications.`],\n        ['Machine view',exact?'The visual shown belongs to this recorded project or machine family.':'The visual is from related VSK work in the same engineering capability area.']\n      ]""","""      sections:[\n        ['What to compare',`Review the ${categoryNames[m.category]||m.category} application, machine configuration${m.control?`, ${m.control} controls`:''} and recorded scope against your own production requirement.`],\n        ['Next step','If this reference is close to your requirement, share the part, target cycle, tolerance and existing machine details with VSK for an application review.']\n      ]""",1)
          v=v.replace("""      const context=archiveImageIsExact(m)?'Project-specific machine view.':'Related VSK engineering work from the same capability is shown for context.';\n      $('[data-archive-preview-copy]').textContent=`${m.note||`${m.title} within VSK’s engineering experience.`} ${context}`;""","""      const application=categoryNames[m.category]||m.category||'machine engineering';\n      $('[data-archive-preview-copy]').textContent=`Documented VSK ${application.toLowerCase()} experience${m.control?` using ${m.control}`:''}. Select “View full reference” to compare the recorded application with your requirement.`;""",1)
          v=v.replace("btn.addEventListener('click',()=>openDossier(m.featureId||m.id,current.map(x=>x.featureId||x.id)))","btn.addEventListener('click',act)",1)
          av.write_text(v)
          PY
          git diff --check
      - name: Commit corrections
        run: |
          git config user.name 'VSK Final Corrections'
          git config user.email 'actions@users.noreply.github.com'
          git add v16-user-polish.css app.js app-v14.js
          git commit -m 'Apply final V16 customer-facing corrections' || true
          git push origin HEAD:client-review-v16-blue-refinement
