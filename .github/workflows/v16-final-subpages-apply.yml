name: Apply V16 Final Subpages

on:
  push:
    branches: [client-review-v16-final-subpages-working]
    paths:
      - '.github/workflows/v16-final-subpages-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: client-review-v16-final-subpages-working
          fetch-depth: 0
      - name: Link V16 Final layers to public subpages
        run: |
          python - <<'PY'
          from pathlib import Path
          files=['projects.html','machines.html','gallery.html']
          target='<link href="styles.css" rel="stylesheet"/>'
          addition='''<link href="styles.css" rel="stylesheet"/>
<link href="v16-final.css" rel="stylesheet"/>
<link href="v16-step6.css" rel="stylesheet"/>
<link href="v16-subpages.css" rel="stylesheet"/>'''
          for name in files:
              p=Path(name)
              s=p.read_text()
              if 'v16-subpages.css' in s:
                  print(f'{name}: already linked')
                  continue
              if target not in s:
                  raise SystemExit(f'{name}: styles.css link not found')
              p.write_text(s.replace(target,addition,1))
              print(f'{name}: linked')
          PY
      - name: Verify all three pages
        run: |
          for f in projects.html machines.html gallery.html; do
            grep -q 'v16-final.css' "$f"
            grep -q 'v16-step6.css' "$f"
            grep -q 'v16-subpages.css' "$f"
          done
      - name: Commit and safely push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects.html machines.html gallery.html
          git commit -m 'Enable V16 Final styling on public subpages'
          git fetch origin client-review-v16-final-subpages-working
          git rebase origin/client-review-v16-final-subpages-working
          git push origin HEAD:client-review-v16-final-subpages-working
