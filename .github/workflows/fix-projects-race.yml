name: Patch Projects runtime race

on:
  push:
    branches:
      - client-review-v17-ia-working
    paths:
      - '.github/workflows/fix-projects-race.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: client-review-v17-ia-working
          fetch-depth: 0
      - name: Suppress obsolete V14 Projects async media hook
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.js')
          s=p.read_text()
          old="""  const loadRuntime = () => {\n    const originalPage = document.body.dataset.page || page;\n    if (page === 'projects') document.body.dataset.page = 'projects-ia';\n    const legacy = document.createElement('script');"""
          new="""  const loadRuntime = () => {\n    const originalPage = document.body.dataset.page || page;\n    if (page === 'projects') {\n      document.body.dataset.page = 'projects-ia';\n      document.querySelector('[data-additional-projects]')?.removeAttribute('data-additional-projects');\n    }\n    const legacy = document.createElement('script');"""
          if old not in s:
              raise SystemExit('current Projects runtime target not found')
          s=s.replace(old,new,1)
          s=s.replace("app-v14.js?v=18.2","app-v14.js?v=18.3",1)
          s=s.replace("architecture.js?v=18.2","architecture.js?v=18.3",1)
          s=s.replace("architecture-fixes.js?v=18.2","architecture-fixes.js?v=18.3",1)
          p.write_text(s)
          PY
          node --check app.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "Remove obsolete Projects media race"
          git push origin HEAD:client-review-v17-ia-working