name: V16 Final Archive Gallery QA

on:
  push:
    branches: [client-review-v16-final-subpages-working]
    paths:
      - '.github/workflows/v16-final-subpages-qa3.yml'
      - 'machines.html'
      - 'gallery.html'
      - 'v16-subpages.css'
      - 'v16-final.css'
      - 'v16-step6.css'
      - 'styles.css'
      - 'app.js'
      - 'app-v14.js'
      - 'data.js'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: client-review-v16-final-subpages-working
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /machines.html
            /gallery.html
            /styles.css
            /v16.css
            /v16-final.css
            /v16-step6.css
            /v16-subpages.css
            /app.js
            /app-v14.js
            /data.js
            /media/**
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Start site
        run: |
          python3 -m http.server 4173 >/tmp/vsk-server.log 2>&1 &
          sleep 2
      - name: Validate Archive and Gallery
        run: |
          cat > qa3.cjs <<'JS'
          const { chromium } = require('playwright');
          const fs=require('fs');
          const wait=ms=>new Promise(r=>setTimeout(r,ms));
          const has=(s,v)=>String(s||'').includes(v);
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const failures=[],checks=[];
            for(const [pageName,file] of [['machines','machines.html'],['gallery','gallery.html']]){
              for(const [mode,width,height] of [['desktop',1440,1000],['mobile',390,844]]){
                const page=await browser.newPage({viewport:{width,height},deviceScaleFactor:1});
                const pageErrors=[],bad=[];
                page.on('pageerror',e=>pageErrors.push(String(e)));
                page.on('response',r=>{if(r.status()>=400&&r.url().startsWith('http://127.0.0.1:4173/'))bad.push(`${r.status()} ${r.url()}`)});
                await page.goto(`http://127.0.0.1:4173/${file}`,{waitUntil:'networkidle'});
                await wait(900);
                const common=await page.evaluate(()=>({
                  width:document.documentElement.scrollWidth,
                  runtime:[...document.scripts].some(s=>(s.src||'').includes('app-v14.js')),
                  linked:[...document.styleSheets].some(s=>(s.href||'').includes('v16-subpages.css')),
                  header:getComputedStyle(document.querySelector('.site-header')).backgroundColor,
                  footer:getComputedStyle(document.querySelector('.site-footer')).backgroundColor
                }));
                if(common.width>width+2)failures.push(`${pageName}/${mode}: initial overflow ${common.width}>${width}`);
                if(!common.runtime)failures.push(`${pageName}/${mode}: app-v14 runtime missing`);
                if(!common.linked)failures.push(`${pageName}/${mode}: v16-subpages.css missing`);
                if(mode==='desktop'&&!has(common.header,'244, 243, 238'))failures.push(`${pageName}: header ${common.header}`);
                if(!has(common.footer,'17, 24, 20'))failures.push(`${pageName}/${mode}: footer ${common.footer}`);

                if(pageName==='machines'){
                  await page.locator('.archive-browser').scrollIntoViewIfNeeded();await wait(600);
                  const state=await page.evaluate(()=>{
                    const n=document.querySelector('.archive-hero-number span');
                    const a=document.querySelector('.archive-mode .is-active');
                    return {number:n?.textContent.trim()||'',numberColor:n?getComputedStyle(n).color:'',rows:document.querySelectorAll('.archive-row').length,result:document.querySelector('[data-result-count]')?.textContent.trim()||'',active:a?getComputedStyle(a).backgroundColor:''};
                  });
                  if(state.number!=='54')failures.push(`machines/${mode}: hero count ${state.number}`);
                  if(!has(state.numberColor,'185, 213, 202'))failures.push(`machines/${mode}: hero number color ${state.numberColor}`);
                  if(state.rows<50)failures.push(`machines/${mode}: archive rows ${state.rows}`);
                  if(!state.result.startsWith('54'))failures.push(`machines/${mode}: result ${state.result}`);
                  if(!has(state.active,'40, 95, 80'))failures.push(`machines/${mode}: active mode ${state.active}`);

                  await page.locator('[data-archive-search]').fill('Kellenberg');await wait(180);
                  const filtered=(await page.locator('[data-result-count]').textContent()||'').trim();
                  if(/^0\b/.test(filtered))failures.push(`machines/${mode}: Kellenberg search ${filtered}`);
                  await page.locator('[data-archive-search]').fill('');await wait(140);

                  await page.locator('[data-archive-mode="visual"]').click();await wait(180);
                  const visual=await page.evaluate(()=>({hidden:document.querySelector('[data-archive-visual-view]').hidden,cards:document.querySelectorAll('.archive-visual-card').length}));
                  if(visual.hidden!==false||visual.cards<1)failures.push(`machines/${mode}: visual archive cards ${visual.cards}`);
                  await page.locator('[data-archive-mode="index"]').click();await wait(140);

                  const first=page.locator('.archive-row').first();
                  if(await first.count()){
                    await first.click();await wait(120);
                    let dossier=await page.evaluate(()=>{const d=document.querySelector('[data-dossier]');return{open:d&&!d.hidden,title:d?.querySelector('[data-dossier-title]')?.textContent?.trim()||''}});
                    if(!dossier.open){
                      const open=page.locator('[data-archive-preview-open]');
                      if(await open.isVisible()){await open.click();await wait(120);dossier=await page.evaluate(()=>{const d=document.querySelector('[data-dossier]');return{open:d&&!d.hidden,title:d?.querySelector('[data-dossier-title]')?.textContent?.trim()||''}});}
                    }
                    if(!dossier.open||!dossier.title)failures.push(`machines/${mode}: reference dossier did not open`);
                    if(dossier.open){await page.evaluate(()=>document.querySelector('[data-dossier] [data-dossier-close]')?.click());await wait(70);}
                  }
                  await page.locator('.archive-browser').screenshot({path:`qa3-machines-${mode}.png`});
                }else{
                  await page.locator('.gallery-browser').scrollIntoViewIfNeeded();await wait(700);
                  const state=await page.evaluate(()=>{
                    const em=document.querySelector('.gallery-hero h1 em'),a=document.querySelector('.gallery-filter.is-active');
                    return {accent:em?getComputedStyle(em).color:'',groups:document.querySelectorAll('.gallery-project-group').length,tiles:document.querySelectorAll('.gallery-tile').length,active:a?getComputedStyle(a).backgroundColor:'',summary:[...document.querySelectorAll('.gallery-summary span')].map(x=>x.textContent.trim())};
                  });
                  if(!has(state.accent,'185, 213, 202'))failures.push(`gallery/${mode}: hero accent ${state.accent}`);
                  if(state.groups<1||state.tiles<1)failures.push(`gallery/${mode}: groups=${state.groups} tiles=${state.tiles}`);
                  if(!has(state.active,'40, 95, 80'))failures.push(`gallery/${mode}: active filter ${state.active}`);
                  if(state.summary.length!==3)failures.push(`gallery/${mode}: summary ${JSON.stringify(state.summary)}`);
                  if(state.tiles){
                    await page.locator('.gallery-tile').first().click();await wait(120);
                    const lightbox=await page.evaluate(()=>{const l=document.querySelector('[data-lightbox]');return{open:l&&!l.hidden,title:l?.querySelector('[data-lightbox-title]')?.textContent?.trim()||''}});
                    if(!lightbox.open||!lightbox.title)failures.push(`gallery/${mode}: lightbox did not open`);
                    if(lightbox.open){await page.evaluate(()=>document.querySelector('[data-lightbox] [data-lightbox-close]')?.click());await wait(70);}
                  }
                  await page.locator('.gallery-browser').screenshot({path:`qa3-gallery-${mode}.png`});
                }

                await page.evaluate(async()=>{const r=document.documentElement,step=Math.max(500,Math.floor(innerHeight*.75));for(let y=0;y<r.scrollHeight;y+=step){scrollTo(0,y);await new Promise(x=>setTimeout(x,55));}scrollTo(0,r.scrollHeight)});await wait(650);
                const final=await page.evaluate(()=>{const imgs=[...document.images].filter(i=>i.offsetParent!==null);return{width:document.documentElement.scrollWidth,broken:imgs.filter(i=>i.complete&&i.naturalWidth===0).map(i=>i.src),pending:imgs.filter(i=>!i.complete).map(i=>i.src)}});
                const unique=[...new Set(bad)];
                if(final.width>width+2)failures.push(`${pageName}/${mode}: final overflow ${final.width}>${width}`);
                if(final.broken.length)failures.push(`${pageName}/${mode}: broken ${final.broken.join(',')}`);
                if(final.pending.length)failures.push(`${pageName}/${mode}: pending ${final.pending.join(',')}`);
                if(pageErrors.length)failures.push(`${pageName}/${mode}: JS ${pageErrors.join(' | ')}`);
                if(unique.length)failures.push(`${pageName}/${mode}: requests ${unique.join(' | ')}`);
                checks.push({page:pageName,mode,common,final,pageErrors,badResponses:unique});
                await page.close();
              }
            }
            fs.writeFileSync('qa3-report.json',JSON.stringify({checks,failures},null,2));
            console.log(fs.readFileSync('qa3-report.json','utf8'));
            await browser.close();
            if(failures.length)process.exit(1);
          })().catch(e=>{try{fs.writeFileSync('qa3-crash.txt',String(e.stack||e))}catch{};console.error(e);process.exit(1)});
          JS
          node qa3.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v16-final-archive-gallery-preview
          path: |
            qa3-*.png
            qa3-report.json
            qa3-crash.txt
          retention-days: 14
