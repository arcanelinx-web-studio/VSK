name: Validate production site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate source site
        run: python scripts/validate_site.py

      - name: Build production package
        run: python scripts/site/build_dist.py

      - name: Validate deployment package
        run: python scripts/site/validate_dist.py

      - name: Upload deploy-ready static site
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: vsk-static-site
          path: dist/
          retention-days: 14
