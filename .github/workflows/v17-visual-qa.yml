name: V17 visual QA

on:
  push:
    branches:
      - client-review-v17-ia-working
    paths:
      - '.github/workflows/v17-visual-qa.yml'
  workflow_dispatch:

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start review server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/vsk-http.log 2>&1 &
          echo $! > /tmp/vsk-http.pid
          sleep 2
      - name: Render 1440px review
        run: |
          mkdir -p visual-qa
          cat > /tmp/visual.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'fs';
          const browser = await chromium.launch({headless:true});
          const context = await browser.newContext({viewport:{width:1440,height:1000},deviceScaleFactor:1});
          const pages = [
            ['home','index.html'],
            ['projects','projects.html'],
            ['experience','experience.html'],
            ['gallery','gallery.html'],
            ['archive','machines.html'],
            ['company','company.html'],
            ['solutions','solutions.html'],
            ['reconditioning','reconditioning.html'],
            ['retrofit','retrofit-cnc.html']
          ];
          const report=[];
          let failed=false;
          for (const [name,path] of pages) {
            const page=await context.newPage();
            const errors=[]; const failedRequests=[];
            page.on('console',msg=>{if(msg.type()==='error')errors.push(msg.text())});
            page.on('pageerror',err=>errors.push(String(err)));
            page.on('requestfailed',req=>{const url=req.url();if(url.startsWith('http://127.0.0.1:8000/'))failedRequests.push(`${url} :: ${req.failure()?.errorText||'failed'}`)});
            await page.goto(`http://127.0.0.1:8000/${path}`,{waitUntil:'networkidle',timeout:45000});
            await page.waitForTimeout(1200);
            const metrics=await page.evaluate(()=>{
              const header=document.querySelector('.site-header');
              const nav=document.querySelector('.desktop-nav');
              const cta=document.querySelector('.header-cta');
              const rect=e=>e?e.getBoundingClientRect():null;
              const images=[...document.images].filter(img=>{const r=img.getBoundingClientRect();return r.top<innerHeight*2.2 && r.bottom>-100});
              return {
                width:innerWidth,
                scrollWidth:document.documentElement.scrollWidth,
                header:rect(header),nav:rect(nav),cta:rect(cta),
                brokenVisibleImages:images.filter(img=>img.complete&&img.naturalWidth===0).map(img=>img.getAttribute('src')),
                h1:document.querySelector('h1')?.innerText||'',
                bodyClass:document.body.className
              };
            });
            const overflow=metrics.scrollWidth>metrics.width+2;
            const headerOverlap=metrics.nav&&metrics.cta ? metrics.nav.right>metrics.cta.left-6 : false;
            const bad=overflow||headerOverlap||metrics.brokenVisibleImages.length||errors.length||failedRequests.length;
            if(bad)failed=true;
            report.push({name,path,overflow,headerOverlap,errors,failedRequests,...metrics});
            await page.screenshot({path:`visual-qa/${name}-1440.png`,fullPage:false});
            if(['home','projects','gallery','archive'].includes(name)) await page.screenshot({path:`visual-qa/${name}-full.png`,fullPage:true});
            await page.close();
          }
          fs.writeFileSync('visual-qa/report.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify(report,null,2));
          await browser.close();
          if(failed) process.exit(1);
          JS
          node /tmp/visual.mjs
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v17-visual-qa
          path: visual-qa
          if-no-files-found: error