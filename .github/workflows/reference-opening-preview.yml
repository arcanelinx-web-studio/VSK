name: Build locked-reference opening preview

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reference-opening-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch reference-only concept
        run: git fetch origin reference-only-opening-v1:reference-only-opening-v1

      - name: Assemble preview
        run: |
          rm -rf preview
          mkdir -p preview
          git show reference-only-opening-v1:index.html > preview/index.html
          git show reference-only-opening-v1:reference-opening.css > preview/reference-opening.css
          git show reference-only-opening-v1:reference-opening.js > preview/reference-opening.js
          cp -R media preview/media

      - name: Validate preview
        run: |
          test -f preview/index.html
          test -f preview/reference-opening.css
          test -f preview/reference-opening.js
          test -f preview/media/brand/vsk-logo.webp
          test -f preview/media/projects/z-cut.webp
          test -f preview/media/hero/air-leak.webp
          node --check preview/reference-opening.js
          grep -q 'VSK Electro-Mech Solutions' preview/index.html
          grep -q 'media/projects/z-cut.webp' preview/index.html
          grep -q 'reference-opening.css' preview/index.html
          grep -q 'reference-opening.js' preview/index.html

      - name: Upload preview
        uses: actions/upload-artifact@v4
        with:
          name: VSK-Locked-Reference-Opening
          path: preview/
          retention-days: 14
