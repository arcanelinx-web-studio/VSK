name: Build Manufact Omnis premium V2 preview

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reference-opening-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch premium V2 concept
        run: git fetch origin manufact-omnis-premium-v2:manufact-omnis-premium-v2

      - name: Assemble preview
        run: |
          rm -rf preview
          mkdir -p preview
          git show manufact-omnis-premium-v2:index.html > preview/index.html
          git show manufact-omnis-premium-v2:premium-v2.css > preview/premium-v2.css
          git show manufact-omnis-premium-v2:premium-v2.js > preview/premium-v2.js
          cp -R media preview/media

      - name: Validate preview
        run: |
          test -f preview/index.html
          test -f preview/premium-v2.css
          test -f preview/premium-v2.js
          test -f preview/media/brand/vsk-logo.webp
          test -f preview/media/retrofit/kellenberg.webp
          node --check preview/premium-v2.js
          grep -q 'VSK Electro-Mech Solutions' preview/index.html
          grep -q 'media/retrofit/kellenberg.webp' preview/index.html
          grep -q 'DM+Sans' preview/index.html
          grep -q 'Hydraulic & pneumatic' preview/index.html
          ! grep -q 'ui-monospace' preview/premium-v2.css

      - name: Upload preview
        uses: actions/upload-artifact@v4
        with:
          name: VSK-Manufact-Omnis-Premium-V2
          path: preview/
          retention-days: 14